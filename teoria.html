<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Control Room · Teoría</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
:root{--red:#E50914;--red2:#B20710;--red3:#ff4d55;--pink:#fff1f2;--ink:#141414;--ink2:#2b2b2b;--muted:#6d6d6d;--line:#e9e9e9;--soft:#f7f7f7;--disp:'Bebas Neue',Impact,'Haettenschweiler','Arial Narrow Bold',sans-serif}
*{box-sizing:border-box}
html{font-size:18px;scroll-behavior:smooth}
html.tv{font-size:22px}
body{margin:0;background:#fff;color:var(--ink);font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;line-height:1.65;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font:inherit;cursor:pointer;color:inherit}
a{color:var(--red)}
::selection{background:var(--red);color:#fff}
.red{color:var(--red)}
:focus-visible{outline:3px solid var(--red);outline-offset:3px}

/* ---------- barra fija ---------- */
#bar{position:fixed;top:0;left:0;height:4px;background:var(--red);z-index:90;width:0;transition:width .15s}
.chrome{position:fixed;top:14px;left:14px;right:14px;z-index:80;display:flex;justify-content:space-between;align-items:center;pointer-events:none}
.chrome>*{pointer-events:auto}
.pill{display:flex;align-items:center;gap:.2rem;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-radius:99px;padding:.3rem;box-shadow:0 8px 30px rgba(0,0,0,.12)}
.pill.dark{background:rgba(20,20,20,.86);color:#fff}
.pill button{border:0;background:none;border-radius:99px;padding:.45rem .85rem;font-weight:800;font-size:.78rem;white-space:nowrap}
.pill button:hover{background:rgba(229,9,20,.12)}
.pill .logo{font-family:var(--disp);font-size:1.5rem;letter-spacing:.05em;color:var(--red);padding:0 .7rem;line-height:1}
.pill .logo span{color:inherit}
#where{font-size:.78rem;font-weight:700;padding:0 .8rem 0 .2rem;max-width:42vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#where b{color:var(--red)}
#rail{position:fixed;right:16px;top:50%;transform:translateY(-50%);z-index:70;display:flex;flex-direction:column;gap:6px}
#rail a{display:block;width:9px;height:9px;border-radius:50%;background:#cfcfcf;position:relative;transition:.25s}
#rail a.m{width:9px;height:18px;border-radius:5px;background:#9a9a9a;margin-top:6px}
#rail a.on{background:var(--red);transform:scale(1.35)}
#rail a span{position:absolute;right:18px;top:50%;transform:translateY(-50%);background:var(--ink);color:#fff;font-size:.7rem;font-weight:700;padding:.2rem .55rem;border-radius:6px;white-space:nowrap;opacity:0;pointer-events:none;transition:.2s}
#rail a:hover span{opacity:1}
.ondark #rail a{background:#555}

/* ---------- portada ---------- */
#hero{position:relative;height:100vh;min-height:620px;overflow:hidden;background:radial-gradient(ellipse at 72% 40%,#fff4f4 0%,#fff 62%)}
#heroCv{position:absolute;inset:0;width:100%;height:100%}
.hero-copy{position:absolute;left:6vw;top:53%;transform:translateY(-50%);max-width:min(720px,88vw);z-index:2}
.kick{color:var(--red);font-weight:900;letter-spacing:.24em;text-transform:uppercase;font-size:.74rem}
.hero-copy h1{font-family:var(--disp);font-weight:400;font-size:clamp(4rem,9.5vw,9.4rem);line-height:.84;margin:.4rem 0 1rem;letter-spacing:.01em}
.hero-copy h1 em{font-style:normal;color:var(--red);display:block;text-shadow:0 14px 40px rgba(229,9,20,.25)}
.hero-copy h1 .w{display:inline-block;opacity:0;transform:translateY(40px) scale(1.1);filter:blur(10px);animation:wIn .9s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes wIn{to{opacity:1;transform:none;filter:none}}
.hero-copy p{font-size:1.15rem;max-width:34rem;color:var(--ink2);background:rgba(255,255,255,.7);border-radius:10px;opacity:0;animation:fade 1s 1.4s forwards}
@keyframes fade{to{opacity:1}}
.scrollcue{position:absolute;left:50%;bottom:26px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:.4rem;font-size:.7rem;font-weight:800;letter-spacing:.2em;color:var(--muted);z-index:2}
.scrollcue i{width:24px;height:38px;border:2px solid var(--ink);border-radius:14px;position:relative}
.scrollcue i::after{content:'';position:absolute;left:50%;top:7px;width:4px;height:8px;margin-left:-2px;border-radius:2px;background:var(--red);animation:sc 1.6s infinite}
@keyframes sc{0%{opacity:0;transform:translateY(-4px)}40%{opacity:1}100%{opacity:0;transform:translateY(12px)}}
.ticker{position:absolute;bottom:0;left:0;right:0;background:var(--ink);color:#fff;font-weight:700;font-size:.8rem;white-space:nowrap;overflow:hidden;padding:.5rem 0;z-index:1}
.ticker div{display:inline-block;animation:tick 50s linear infinite;padding-left:100%}
.ticker b{color:var(--red3);margin:0 .5rem}
@keyframes tick{to{transform:translateX(-100%)}}

/* ---------- escenas a pantalla completa ---------- */
.full{min-height:100vh;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;padding:12vh 6vw}
.full.dark{background:var(--ink);color:#fff}
.full.soft{background:var(--soft)}
.rv{opacity:0;transform:translateY(40px);transition:opacity 1s cubic-bezier(.2,.8,.2,1),transform 1s cubic-bezier(.2,.8,.2,1)}
.rv.in{opacity:1;transform:none}
.rv.d1{transition-delay:.15s}.rv.d2{transition-delay:.3s}.rv.d3{transition-delay:.45s}.rv.d4{transition-delay:.6s}
.big{font-family:var(--disp);font-weight:400;line-height:.88;letter-spacing:.01em;margin:0}
.lede{font-size:clamp(1.05rem,1.6vw,1.35rem);max-width:44rem;line-height:1.55}

/* portada de módulo */
.mcov{background:var(--ink);color:#fff;min-height:100vh;position:relative;overflow:hidden;display:flex;align-items:center;padding:10vh 7vw}
.mcov .huge{position:absolute;right:-2vw;bottom:-8vw;font-family:var(--disp);font-size:58vw;line-height:.75;color:transparent;-webkit-text-stroke:2px rgba(229,9,20,.55);pointer-events:none}
.mcov .huge.fill{color:rgba(229,9,20,.12)}
.mcov h2{font-family:var(--disp);font-weight:400;font-size:clamp(4rem,11vw,11rem);line-height:.82;margin:.3rem 0 1.2rem;position:relative}
.mcov .kick{color:#ff9aa0}
.mcov ul{list-style:none;padding:0;margin:1.4rem 0 0;display:grid;gap:.5rem;position:relative;max-width:46rem}
.mcov li{display:flex;gap:1rem;align-items:baseline;font-size:1.02rem;color:#ddd}
.mcov li b{font-family:var(--disp);font-weight:400;font-size:1.5rem;color:var(--red3);min-width:2.6rem}
.mcov .stripe{position:absolute;left:0;top:0;bottom:0;width:10px;background:var(--red);transform-origin:top;transform:scaleY(0);transition:transform 1.4s cubic-bezier(.2,.8,.2,1)}
.mcov.in .stripe{transform:none}

/* portada de tema */
.tcov{min-height:100vh;position:relative;overflow:hidden;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);align-items:center;gap:4vw;padding:12vh 7vw;background:#fff}
.tcov .num{font-family:var(--disp);font-size:clamp(9rem,26vw,24rem);line-height:.78;color:var(--red);position:relative}
.tcov .num::after{content:attr(data-n);position:absolute;left:.06em;top:.06em;color:transparent;-webkit-text-stroke:2px var(--ink);z-index:-1}
.tcov h2{font-family:var(--disp);font-weight:400;font-size:clamp(2.8rem,6vw,5.6rem);line-height:.9;margin:.4rem 0 1rem}
.tcov .idea{font-size:clamp(1.15rem,2vw,1.6rem);font-weight:300;line-height:1.4;border-left:6px solid var(--red);padding-left:1.1rem;margin:0}
.tcov .idea b{font-weight:800}
.tcov .map{display:flex;flex-wrap:wrap;gap:.45rem;margin-top:1.6rem}
.tcov .map span{border:1.5px solid var(--ink);border-radius:99px;padding:.25rem .8rem;font-size:.78rem;font-weight:700}
.tcov .bgline{position:absolute;inset:auto 0 0 0;height:38%;background:linear-gradient(transparent,var(--soft));z-index:-2}

/* ---------- historia con diagrama fijo ---------- */
.story{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);position:relative;background:var(--soft)}
.stage{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;justify-content:center;padding:9vh 2vw 5vh 4vw}
.stage .cap{display:flex;justify-content:space-between;align-items:center;margin-bottom:.8rem;gap:1rem}
.stage .cap b{font-family:var(--disp);font-weight:400;font-size:1.7rem;letter-spacing:.03em;line-height:1}
.stage .cap .dots{display:flex;gap:5px}
.stage .cap .dots i{width:22px;height:5px;border-radius:99px;background:#ddd;transition:.3s}
.stage .cap .dots i.on{background:var(--red)}
.stage .cap .dots i.past{background:var(--ink)}
.vbox{background:#fff;border-radius:22px;box-shadow:0 20px 60px rgba(0,0,0,.08);padding:1.2rem;position:relative;overflow:hidden}
.vbox svg{width:100%;height:auto;max-height:72vh;display:block}
.steps{padding:0 4vw 0 1vw}
.step{min-height:100vh;display:flex;align-items:center}
.step:first-child{min-height:90vh}
.step:last-child{min-height:110vh}
.step .card{background:#fff;border-radius:22px;padding:2rem 2.1rem;box-shadow:0 18px 50px rgba(0,0,0,.08);max-width:34rem;opacity:.28;transform:translateX(30px) scale(.98);transition:opacity .6s,transform .6s cubic-bezier(.2,.8,.2,1);border-top:6px solid transparent}
.step.act .card{opacity:1;transform:none;border-top-color:var(--red)}
.step .k{font-size:.7rem;font-weight:900;letter-spacing:.2em;text-transform:uppercase;color:var(--red)}
.step h3{font-size:1.45rem;line-height:1.2;margin:.35rem 0 .7rem;font-weight:900;letter-spacing:-.01em}
.step p{margin:.6rem 0;font-size:1rem}
.step ul,.step ol{padding-left:1.2rem;margin:.6rem 0}
.step li{margin:.35rem 0}
.f{font-family:'SFMono-Regular',Consolas,'Courier New',monospace;background:var(--ink);color:#fff;border-radius:10px;padding:.7rem 1rem;margin:.8rem 0;font-size:.88rem;border-left:6px solid var(--red);line-height:1.55;overflow-x:auto}
.f b{color:#ff9aa0}
.note{background:var(--pink);border-radius:12px;padding:.75rem 1rem;font-size:.92rem;margin:.8rem 0}
.note.k{background:var(--soft)}
.step .mini{width:100%;border-collapse:collapse;font-size:.85rem;margin:.6rem 0}
.mini th{background:var(--ink);color:#fff;text-align:left;padding:.4rem .55rem;font-weight:700}
.mini td{border-bottom:1px solid var(--line);padding:.4rem .55rem;vertical-align:top}

/* ---------- animación declarativa de SVG ---------- */
svg [data-in]{opacity:0;transition:opacity .7s cubic-bezier(.2,.8,.2,1),transform .7s cubic-bezier(.2,.8,.2,1);transform:translateY(14px);transform-box:fill-box}
svg [data-in].vis{opacity:1;transform:none}
svg [data-in].fadeonly{transform:none}
svg .dr{transition:stroke-dashoffset 1.6s cubic-bezier(.4,.1,.2,1) .15s}
svg .grow{transform-box:fill-box;transform-origin:50% 100%;transition:transform 1.1s cubic-bezier(.2,.8,.2,1)}
svg .growx{transform-box:fill-box;transform-origin:0 50%;transition:transform 1.1s cubic-bezier(.2,.8,.2,1)}
svg .mv{transition:transform 1s cubic-bezier(.2,.8,.2,1)}
svg .lift{transition:transform 1.3s cubic-bezier(.2,.8,.2,1) 1s}
svg .vis .lift{transform:translate(-260px,-40px) rotate(-25deg)}
svg .drp{opacity:0}
svg .vis .drp{animation:drop .55s cubic-bezier(.3,.7,.4,1) forwards}
@keyframes drop{from{opacity:0;transform:translateY(-300px)}to{opacity:1;transform:none}}
svg .pulse{animation:pl 1.6s infinite;transform-box:fill-box;transform-origin:center}
@keyframes pl{50%{transform:scale(1.25);opacity:.55}}
svg .spin{animation:sp 12s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes sp{to{transform:rotate(360deg)}}
svg .flow{stroke-dasharray:6 8;animation:fl 1s linear infinite}
@keyframes fl{to{stroke-dashoffset:-14}}
svg .blink{animation:bk 1s infinite}
@keyframes bk{50%{opacity:.25}}
svg text{font-family:Inter,system-ui,sans-serif}
svg .bb{font-family:var(--disp)}

/* ---------- cierre ---------- */
.end{background:var(--ink);color:#fff;min-height:100vh;padding:14vh 7vw;position:relative;overflow:hidden}
.end h2{font-family:var(--disp);font-weight:400;font-size:clamp(3.5rem,9vw,8rem);line-height:.85;margin:.3rem 0 1.4rem}
.end h2 em{font-style:normal;color:var(--red3)}
.recap{display:grid;grid-template-columns:repeat(3,1fr);gap:1.4rem;margin-top:2rem}
.recap div{border-top:4px solid var(--red);padding-top:.9rem}
.recap b{font-family:var(--disp);font-weight:400;font-size:2rem;letter-spacing:.03em}
.recap p{color:#cfcfcf;font-size:.92rem;margin:.3rem 0 0}

/* ---------- índice a pantalla completa ---------- */
#index{position:fixed;inset:0;z-index:95;background:var(--ink);color:#fff;overflow:auto;padding:12vh 6vw 6vh;display:none}
#index.on{display:block;animation:fade .3s}
#index h2{font-family:var(--disp);font-weight:400;font-size:clamp(3rem,7vw,6rem);line-height:.9;margin:0 0 2rem}
.icol{display:grid;grid-template-columns:repeat(3,1fr);gap:2.4rem}
.icol h3{font-family:var(--disp);font-weight:400;font-size:2.2rem;color:var(--red3);margin:0 0 .6rem;line-height:1}
.icol a{display:flex;gap:.8rem;padding:.5rem 0;color:#eee;text-decoration:none;border-bottom:1px solid #2c2c2c;font-weight:600;font-size:.95rem}
.icol a:hover{color:#fff;padding-left:.4rem;transition:.2s}
.icol a span{color:#ff9aa0;font-weight:900;min-width:2.2rem}
.xbtn{position:fixed;right:22px;top:18px;width:46px;height:46px;border-radius:50%;border:0;background:var(--red);color:#fff;font-size:1.2rem;font-weight:900;z-index:96}
.irow{display:flex;gap:.6rem;flex-wrap:wrap;margin:-1rem 0 2.4rem}
.irow button{background:transparent;border:2px solid #fff;color:#fff;border-radius:99px;padding:.5rem 1.1rem;font-weight:800;font-size:.85rem}
.irow button:hover{background:#fff;color:var(--ink)}

/* ---------- modal y siglas ---------- */
.modal{position:fixed;inset:0;z-index:120;display:none;align-items:center;justify-content:center;padding:3vh 3vw;background:rgba(20,20,20,.6);backdrop-filter:blur(5px)}
.modal.on{display:flex}
.mbox{background:#fff;border-radius:20px;max-width:920px;width:100%;max-height:90vh;overflow:auto;position:relative}
.mhead{background:var(--ink);color:#fff;padding:1.3rem 1.6rem;position:sticky;top:0;z-index:2}
.mhead h2{font-family:var(--disp);font-weight:400;font-size:2.4rem;line-height:1;margin:0}
.mbody{padding:1.2rem 1.6rem 1.6rem}
.mclose{position:absolute;right:1rem;top:1rem;z-index:3;width:2.4rem;height:2.4rem;border-radius:50%;border:0;background:rgba(255,255,255,.18);color:#fff;font-weight:800}
.search{width:100%;padding:.7rem .9rem;border:2px solid var(--ink);border-radius:8px;font:inherit;margin-bottom:1rem}
.gl{display:grid;grid-template-columns:1fr 1fr;gap:.7rem}
.gl>div{border:1px solid var(--line);border-radius:12px;padding:.8rem .9rem;font-size:.86rem}
.gl b{color:var(--red)}
table.tb{width:100%;border-collapse:collapse;font-size:.86rem}
.tb th{background:var(--ink);color:#fff;text-align:left;padding:.5rem .6rem}
.tb td{border-bottom:1px solid var(--line);padding:.45rem .6rem}
abbr.t{text-decoration:none;border-bottom:1.5px dotted var(--red);cursor:help}
#pop{position:fixed;z-index:150;max-width:340px;background:#fff;border:2px solid var(--ink);border-radius:12px;padding:.8rem .95rem;box-shadow:0 20px 50px rgba(0,0,0,.2);font-size:.85rem;display:none;line-height:1.5}
#pop h4{margin:0 0 .3rem;color:var(--red);font-size:.95rem}

@media (max-width:980px){
 html{font-size:17px}
 .story{display:block}
 .stage{height:56vh;padding:64px 12px 8px;z-index:2;background:var(--soft)}
 .stage .cap b{font-size:1.2rem}
 .vbox{padding:.5rem;border-radius:14px}
 .vbox svg{max-height:44vh}
 .steps{padding:0 12px;position:relative;z-index:3}
 .step{min-height:100vh;align-items:flex-end;padding-bottom:2vh}
 .step:first-child{min-height:100vh}
 .step .card{padding:1rem 1.1rem;max-width:none;opacity:0;transform:translateY(30px);max-height:41vh;overflow:auto;font-size:.95rem}
 .step h3{font-size:1.15rem}
 .step.act .card{opacity:.98}
 .stage{height:57vh}
 .tcov{grid-template-columns:1fr;padding:14vh 7vw 8vh}
 .icol,.recap{grid-template-columns:1fr}
 #rail,.hideS{display:none}
 #where{display:none}
 .pill .logo{font-size:1.2rem}
 .gl{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div id="bar"></div>
<div class="chrome">
  <div class="pill"><span class="logo">CONTROL<span style="color:#141414">ROOM</span></span><span id="where">Teoría</span></div>
  <div class="pill"><button onclick="openIndex()">☰ Temas</button><button class="hideS" onclick="openGlossary()">Glosario</button><button class="hideS" onclick="openAcr()">Siglas</button><button onclick="toggleTV()" title="Letra grande para proyectar">Aa</button></div>
</div>
<nav id="rail" aria-label="Avance por temas"></nav>
<main id="main"></main>
<div id="index"><button class="xbtn" onclick="closeIndex()" aria-label="Cerrar">✕</button><div class="kick" style="color:#ff9aa0">Seguimiento y control de proyectos de software</div><h2>TEMAS</h2><div class="irow"><button onclick="closeIndex();openGlossary()">Glosario</button><button onclick="closeIndex();openAcr()">Siglas</button><button onclick="closeIndex();openRefs()">Referencias</button><button onclick="closeIndex();openCtx()">Guía PMBOK® 8</button></div><div class="icol" id="icol"></div></div>
<div id="pop"></div>
<div class="modal" id="modal"><div class="mbox"><button class="mclose" onclick="closeModal()" aria-label="Cerrar">✕</button><div id="modalBody"></div></div></div>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const GL={
 PV:{t:'PV · Valor Planificado',d:'Presupuesto autorizado asignado al trabajo que, según la línea base, debía estar hecho a la fecha de corte.',f:'PV = Σ presupuesto del trabajo programado a la fecha',s:'PMI, Standard for Earned Value Management (2019)'},
 EV:{t:'EV · Valor Ganado',d:'Valor, expresado en el presupuesto de la línea base, del trabajo realmente completado. No es lo gastado: es lo “ganado”.',f:'EV = % completado × BAC',s:'Fleming & Koppelman, Earned Value Project Management'},
 AC:{t:'AC · Costo Real',d:'Costo efectivamente incurrido por el trabajo realizado en el periodo medido.',f:'AC = Σ costos reales',s:'PMI (2019)'},
 BAC:{t:'BAC · Presupuesto hasta la conclusión',d:'Suma de todos los presupuestos de la línea base de medición del desempeño. Cambia solo vía control de cambios aprobado.',s:'PMI (2019)'},
 CV:{t:'CV · Variación del costo',d:'Diferencia entre lo ganado y lo gastado. Negativa = sobrecosto.',f:'CV = EV − AC',s:'PMI (2019)'},
 SV:{t:'SV · Variación del cronograma',d:'Diferencia entre lo ganado y lo planificado, en dinero. Tiende a 0 al final aunque el proyecto llegue tarde.',f:'SV = EV − PV',s:'Lipke (2003)'},
 CPI:{t:'CPI · Índice de desempeño del costo',d:'Valor obtenido por cada dólar gastado. Es el indicador financiero más estable: estudios sobre contratos de defensa de EE. UU. (Christensen) muestran que el CPI acumulado cambia poco después de ~20% de avance.',f:'CPI = EV / AC',s:'Fleming & Koppelman; Christensen (1990s)'},
 SPI:{t:'SPI · Índice de desempeño del cronograma',d:'Eficiencia con que se ejecuta el plan. Limitación: siempre converge a 1,0 al terminar, aunque haya retraso.',f:'SPI = EV / PV',s:'PMI (2019); Lipke (2003)'},
 EAC:{t:'EAC · Estimación a la conclusión',d:'Pronóstico del costo total. Fórmula típica si el desempeño actual continúa; la compuesta si el atraso también presiona el costo.',f:'EAC = BAC / CPI   ·   EAC = AC + (BAC − EV) / (CPI × SPI)',s:'PMI (2019)'},
 ETC:{t:'ETC · Estimación hasta la conclusión',d:'Costo esperado para terminar el trabajo restante.',f:'ETC = EAC − AC',s:'PMI (2019)'},
 VAC:{t:'VAC · Variación a la conclusión',d:'Déficit o superávit proyectado al cierre.',f:'VAC = BAC − EAC',s:'PMI (2019)'},
 TCPI:{t:'TCPI · Índice de desempeño para completar',d:'Eficiencia que se debería lograr con el dinero restante para cumplir el BAC. Una regla práctica: si supera 1,10, la meta suele ser poco realista.',f:'TCPI = (BAC − EV) / (BAC − AC)',s:'Fleming & Koppelman'},
 ES:{t:'ES · Cronograma Ganado (Earned Schedule)',d:'Momento del plan en que el PV era igual al EV actual. Mide el cronograma en unidades de tiempo y corrige el defecto del SPI.',f:'ES = C + (EV − PV_C) / (PV_C+1 − PV_C)',s:'Lipke, W. (2003). Schedule is different'},
 SPIt:{t:'SPI(t) · Índice de cronograma por tiempo',d:'Cronograma ganado sobre tiempo real. A diferencia del SPI, sí revela el retraso al final.',f:'SPI(t) = ES / AT   ·   IEAC(t) = Duración planificada / SPI(t)',s:'Lipke (2003); Vandevoorde & Vanhoucke (2006)'},
 EVM:{t:'EVM · Gestión del Valor Ganado',d:'Técnica que integra alcance, cronograma y costo en una sola línea base para medir desempeño y pronosticar. Estandarizada en EIA-748.',s:'PMI (2019); EIA-748'},

steps:[
['Punto de partida','Un número no es información','<p>Un termómetro marca <b>38,5 °C</b>. Es un dato. Se convierte en información cuando sabemos que por encima de 38 °C hay fiebre y que la fiebre exige una acción: llamar al médico.</p><p>En un proyecto pasa lo mismo. “El equipo registró <b>2.000 horas</b>” no dice si avanzamos, si gastamos de más ni qué hacer. Le faltan tres cosas: una <b>referencia</b> contra la cual comparar, un <b>umbral</b> que separe lo aceptable de lo preocupante y una <b>decisión</b> asociada.</p><p>La norma ISO/IEC/IEEE 15939 (proceso de medición) ordena ese camino en cuatro escalones.</p>'],
['Escalones 1 y 2','De la medida base a la métrica','<p><b>Medida base:</b> el dato crudo que sale de una sola fuente. Horas registradas, costo facturado, puntos de historia terminados, defectos abiertos.</p><p><b>Métrica</b> (medida derivada): una combinación matemática de medidas base. Al dividir el valor de lo construido entre lo que costó, aparece una relación:</p><div class="f">CPI = EV ÷ AC = 468.000 ÷ 552.000 = <b>0,85</b></div><p>La métrica ya compara, pero todavía no dice si 0,85 es bueno o malo, ni quién debe actuar.</p>'],
['Escalón 3','El indicador: métrica + umbral + acción','<p>Un <b>indicador</b> toma la métrica y le agrega umbrales aprobados e interpretación. En AURORA Pay la gobernanza fijó:</p><ul><li><b>≥ 0,95</b>, verde: gestión por excepción.</li><li><b>0,90 – 0,95</b>, amarillo: el PM analiza la causa raíz.</li><li><b>&lt; 0,90</b>, rojo: plan de recuperación ante el sponsor.</li></ul><p>Con 0,85 la aguja cae en rojo y la acción queda definida de antemano: escalar. Por eso se dice que <b>un indicador sin acción asociada es decoración</b>.</p>'],
['Escalón 4','KPI: los pocos que mueven decisiones','<p>Un proyecto puede calcular decenas de indicadores. Los <b>KPI</b> (indicadores clave de desempeño) son los pocos que la dirección usa para decidir: en AURORA, CPI, SPI(t), costo final estimado, defectos escapados, consumo de reservas y satisfacción del cliente.</p><p>Más no es mejor. Un tablero de 30 números diluye la atención: nadie decide con 30 números. La pregunta que filtra es: <i>¿qué haría distinto la dirección si este número cambiara?</i></p>'],
['Cómo se diseña','GQM: del objetivo a la métrica','<p>El error más común es medir lo que es fácil en lugar de lo que importa. El enfoque <b>GQM</b> (Goal–Question–Metric) de Basili, Caldiera y Rombach (1994) invierte el orden:</p><ol><li>Se fija el <b>objetivo</b> de control: entregar dentro de $1.200.000.</li><li>Se formulan las <b>preguntas</b> que permiten saber si se cumple: ¿obtenemos el valor esperado por dólar? ¿cuánto costará al final? ¿es realista cumplir?</li><li>Solo entonces se eligen las <b>métricas</b> que responden cada pregunta: CPI, EAC, TCPI…</li></ol><p>Así cada número del tablero existe porque responde a algo que alguien necesita saber.</p>'],
['Tiempo para reaccionar','Indicadores adelantados y rezagados','<p>Un indicador <b>rezagado</b> muestra un resultado que ya ocurrió: el costo real, los defectos en producción, el CPI. Un indicador <b>adelantado</b> anticipa lo que viene: la moral del equipo, la deuda técnica, el trabajo en curso, la rotación.</p><p>En la gráfica, la moral empieza a caer en el mes 2 y el CPI recién se mueve en el mes 4. Esos <b>dos meses</b> son la ventaja de mirar adelantados: tiempo para actuar antes de que el problema llegue al dinero.</p><p>Un buen sistema combina ambos: los rezagados <b>confirman</b>, los adelantados <b>avisan</b>.</p>'],
['El contrato del indicador','La ficha técnica','<p>Todo indicador que se reporta necesita una ficha que lo defina sin ambigüedad. Cada campo resuelve un problema real:</p><ul><li><b>Fuentes</b> y <b>fórmula</b> hacen el cálculo reproducible por cualquiera.</li><li><b>Responsable</b> evita que “todos” y “nadie” lo actualicen.</li><li><b>Umbrales</b> y <b>acción</b> convierten el número en decisión.</li></ul><div class="note">Cambiar la fórmula a mitad del proyecto sin avisar destruye la comparabilidad: el mes 7 ya no se puede comparar con el mes 6. Y medir actividad (“2.000 horas”) en lugar de resultado es la trampa más frecuente.</div>']]});

steps:[
['Analogía','Sin ruta planificada no hay desvío','<p>Un GPS solo puede decir “te desviaste 3 km” porque conoce la ruta que debías seguir. Sin ella, cualquier camino sería igual de válido.</p><p>En un proyecto, esa ruta es la <b>línea base</b>: la versión <b>aprobada</b> del plan contra la cual se compara la realidad. Medir sin línea base es como manejar sin destino: hay movimiento, pero no hay desviación que corregir.</p>'],
['Qué la compone','Tres líneas base integradas','<p>La <b>línea base para la medición del desempeño</b> (PMB, Performance Measurement Baseline) integra tres compromisos:</p><ul><li><b>Alcance</b>: qué se entrega, descompuesto en la estructura de desglose del trabajo (EDT) hasta paquetes de trabajo.</li><li><b>Cronograma</b>: cuándo se ejecuta cada paquete.</li><li><b>Costo</b>: cuánto presupuesto tiene cada paquete en cada periodo.</li></ul><p>Integrarlas es lo que permite medir: cada paquete tiene un “precio” y una fecha. La línea base <b>solo cambia mediante control integrado de cambios</b>; si cualquiera pudiera moverla, dejaría de servir como referencia.</p>'],
['La forma del plan','¿Por qué el plan dibuja una “S”?','<p>Si se suma mes a mes el presupuesto planificado (PV) de todos los paquetes, el acumulado forma una <b>curva S</b>:</p><ul><li><b>Arranque lento</b>: pocos paquetes activos (definición, arquitectura, contratación).</li><li><b>Pendiente máxima</b> a mitad: todos los equipos produciendo a la vez.</li><li><b>Cierre suave</b>: pruebas finales, certificación, despliegue.</li></ul><p>Las barras grises son el PV de cada mes; la línea roja es su acumulado. Esa curva es la referencia contra la que se comparará cada mes lo realmente ganado.</p>'],
['Dónde viven las reservas','Contingencia adentro, gestión afuera','<p>No todo el dinero del proyecto está en los paquetes:</p><ul><li>La <b>reserva de contingencia</b> cubre <b>riesgos identificados</b> (por ejemplo, el retraso de una API del banco aliado). Forma parte de la línea base de costos.</li><li>La <b>reserva de gestión</b> cubre <b>lo desconocido</b>. Queda fuera de la línea base y solo la libera la dirección.</li></ul><div class="f">Paquetes $1.104.000 + contingencia $96.000 = <b>BAC $1.200.000</b><br>BAC + reserva de gestión $60.000 = presupuesto del proyecto</div><p>BAC (Budget at Completion) es el presupuesto hasta la conclusión: la cifra que se usa en todos los cálculos de valor ganado.</p>'],
['Medir el avance','¿Cuánto “se ganó”?','<p>El <b>valor ganado</b> de un paquete es su presupuesto multiplicado por su porcentaje de avance. La pregunta crítica es <b>cómo</b> se determina ese porcentaje sin depender de opiniones:</p><ul><li><b>0/100</b>: nada hasta terminar y aceptar. Para tareas cortas; la más conservadora.</li><li><b>50/50</b> o <b>20/80</b>: una parte al iniciar, el resto al terminar.</li><li><b>Hitos ponderados</b>: cada entregable verificable vale un peso fijo. Para paquetes largos.</li><li><b>Unidades completadas</b>: migrar 400 tablas, integrar 30 bancos.</li><li><b>Puntos “hechos”</b>: solo cuentan los que cumplen la Definición de Hecho.</li><li><b>Esfuerzo de nivel</b>: gestión y soporte; gana lo planificado y no informa nada, por eso debe ser una parte pequeña.</li></ul>'],
['Un fenómeno conocido','El síndrome del 90%','<p>Cuando el avance lo estima quien hace el trabajo, aparece un patrón: la tarea sube rápido hasta “90%” y se queda ahí durante semanas. El último 10% (integrar, probar, corregir) es siempre más largo de lo que parece desde adentro.</p><p>Las técnicas basadas en <b>entregables verificables</b> lo evitan: con 0/100 o con hitos ponderados, el avance solo sube cuando alguien puede comprobar algo terminado.</p><div class="note"><b>Principio clave:</b> el porcentaje de avance nunca es el porcentaje de horas ni de dinero consumido. Si lo fuera, el valor ganado siempre igualaría al costo real y el índice de costo sería siempre 1.</div>'],
['Ejemplo completo','AURORA Pay, mes 6: $468.000 ganados','<p>Cada paquete se mide con la técnica que corresponde a su naturaleza:</p><ul><li><b>Onboarding</b> (0/100): terminado y aceptado → $120.000.</li><li><b>Motor de pagos</b> (hitos): diseño 20% ✔ y API 40% ✔; pruebas y certificación pendientes → 60% de $240.000 = $144.000.</li><li><b>App móvil</b> (puntos): 100 de 300 puntos “hechos” → $100.000.</li><li><b>Seguridad PCI-DSS</b> (50/50): iniciada → $80.000.</li><li><b>Gestión</b> (esfuerzo de nivel) → $24.000.</li></ul><p>Total: <b>EV = $468.000</b>. El líder de la app decía “vamos al 50%” porque había usado la mitad de sus horas; lo verificable era 33%. Esa diferencia, multiplicada por todos los paquetes, es la que esconde los problemas.</p>']]});

steps:[
['Analogía','Tres preguntas, tres cantidades','<p>Te contratan para pintar <b>10 paredes</b>, una por día, a <b>$100</b> cada una. El plan dice que al final del día 4 deberían estar pintadas 4 paredes. Ese trabajo, valorado al precio del plan, es el <b>valor planificado</b>:</p><div class="f">PV (Planned Value) = 4 paredes × $100 = <b>$400</b></div><p>PV responde: ¿cuánto trabajo, valorado en presupuesto, <b>debía</b> estar hecho a la fecha?</p>'],
['La realidad','Lo que está hecho y lo que costó','<p>Al llegar el día 4 hay <b>3</b> paredes terminadas. Valoradas al precio del plan, son el <b>valor ganado</b>:</p><div class="f">EV (Earned Value) = 3 × $100 = <b>$300</b></div><p>Pero pagaste más pintura y horas de lo previsto: el <b>costo real</b> fue de $360.</p><div class="f">AC (Actual Cost) = <b>$360</b></div><p>EV no es lo gastado: es lo que <b>vale</b> lo hecho según el plan. Esa es la idea que hace funcionar todo el método.</p>'],
['La trampa más común','Nunca compares lo gastado con lo planificado','<p>Si solo se mira AC contra PV: $360 frente a $400. Parece que “vamos $40 por debajo del presupuesto”.</p><p>Es falso. Se gastó menos porque <b>se hizo menos</b>. AC y PV miden cosas distintas: uno el gasto real, el otro el trabajo previsto. La comparación correcta siempre pasa por EV:</p><ul><li>EV contra PV habla de <b>tiempo</b> (¿hicimos lo previsto?).</li><li>EV contra AC habla de <b>costo</b> (¿lo hecho costó lo que valía?).</li></ul>'],
['En dinero','Variaciones: cuánto nos desviamos','<div class="f">SV (variación del cronograma) = EV − PV = 300 − 400 = <b>−$100</b><br>CV (variación del costo) = EV − AC = 300 − 360 = <b>−$60</b></div><p>En valor ganado, <b>negativo siempre es desfavorable</b>. SV dice que el atraso equivale a $100 de trabajo; CV dice que lo hecho costó $60 más de lo que valía.</p><p>Para comparar proyectos de tamaños distintos se usan porcentajes: CV% = CV ÷ EV = −20% y SV% = SV ÷ PV = −25%.</p>'],
['En eficiencia','Índices: centavos por dólar','<div class="f">CPI = EV ÷ AC = 300 ÷ 360 = <b>0,83</b><br>SPI = EV ÷ PV = 300 ÷ 400 = <b>0,75</b></div><p>El <b>CPI</b> (índice de desempeño del costo) se lee así: por cada dólar gastado se obtienen 83 centavos de valor. El <b>SPI</b> (índice de desempeño del cronograma): se ha ejecutado el 75% de lo que debía estar listo.</p><p>Mayor que 1 es favorable, igual a 1 es según el plan, menor que 1 es desfavorable. Los índices son ideales para comparar en el tiempo y entre proyectos.</p>'],
['Mapa del diagnóstico','El cuadrante de desempeño','<p>Con CPI en un eje y SPI en el otro, todo proyecto cae en una de cuatro zonas. Cada zona sugiere hipótesis distintas:</p><ul><li><b>Atrasado y bajo costo</b>: el equipo es eficiente pero falta capacidad o hay un bloqueo externo.</li><li><b>Adelantado y con sobrecosto</b>: se está comprando velocidad (horas extra, más gente).</li><li><b>Atrasado y con sobrecosto</b>: la zona más grave; suele haber retrabajo o problemas técnicos.</li></ul><p>La pintura (SPI 0,75; CPI 0,83) y AURORA Pay (0,87; 0,85) están en la misma zona.</p>'],
['Caso real','AURORA Pay, mes 6','<div class="f">CV = 468.000 − 552.000 = <b>−$84.000</b> (−17,9%)<br>SV = 468.000 − 540.000 = <b>−$72.000</b> (−13,3%)<br>CPI = 468.000 ÷ 552.000 = <b>0,85</b><br>SPI = 468.000 ÷ 540.000 = <b>0,87</b></div><p>Lectura: por cada dólar gastado se obtienen 85 centavos y se ejecutó el 87% de lo previsto. Ambos índices están en zona roja.</p><p>Si el sponsor solo mira AC contra PV ($552.000 frente a $540.000) verá un 2% por encima y pensará que “vamos casi en presupuesto”. El valor ganado revela un problema de casi <b>18%</b>.</p>']]});

steps:[
['La pregunta del sponsor','“¿Cuánto costará al final?”','<p>Los indicadores de estado miran hacia atrás. Controlar exige mirar hacia adelante: con lo que sabemos hoy, ¿cuánto costará el proyecto al terminar?</p><ul><li><b>BAC</b> (presupuesto hasta la conclusión): lo que <b>prometimos</b>, $1.200.000.</li><li><b>EAC</b> (estimación a la conclusión): lo que hoy <b>creemos</b> que costará.</li></ul><p>Seguir reportando el BAC como si fuera el pronóstico, cuando el CPI es 0,85, es ocultar información.</p>'],
['Lo que falta','El trabajo pendiente tiene un precio de plan','<div class="f">Trabajo pendiente = BAC − EV = 1.200.000 − 468.000 = <b>$732.000</b></div><p>Ese es el valor, <b>a precio de plan</b>, de todo lo que falta construir. La pregunta decisiva es: ¿con qué eficiencia se hará?</p><p>Cada fórmula de EAC responde distinto a esa pregunta. Ninguna es “la correcta” en abstracto: es correcta la que corresponde a <b>lo que creemos que pasará</b>.</p>'],
['Dos supuestos opuestos','“Fue un accidente” o “seguiremos igual”','<div class="f">Atípica: EAC = AC + (BAC − EV) = 552.000 + 732.000 = <b>$1.284.000</b></div><p>Supone que la desviación no se repetirá: lo que falta costará lo presupuestado. Sirve si el sobrecosto vino de un evento único (una multa, una licencia).</p><div class="f">Típica: EAC = BAC ÷ CPI = 1.200.000 ÷ 0,848 = <b>$1.415.385</b></div><p>Supone que la eficiencia actual continuará. Es la referencia por defecto cuando no hay razones para esperar un cambio.</p>'],
['Dos supuestos más','Acelerar o re-estimar','<div class="f">Compuesta: EAC = AC + (BAC − EV) ÷ (CPI × SPI)<br>= 552.000 + 732.000 ÷ 0,735 = <b>$1.548.213</b></div><p>Supone que el atraso también presionará el costo: con una fecha regulatoria inamovible, habrá que acelerar pagando más.</p><div class="f">Ascendente: EAC = AC + ETC re-estimado = 552.000 + 780.000 = <b>$1.332.000</b></div><p>El plan original ya no sirve (cambios profundos de tecnología, equipo o alcance) y el equipo vuelve a estimar lo que falta, de abajo hacia arriba.</p><p>En AURORA la causa del sobrecosto (deuda técnica y retrabajo) <b>sigue activa</b>: la fórmula atípica no se sostiene.</p>'],
['Lo que falta gastar','ETC y VAC','<div class="f">ETC (estimación hasta la conclusión) = EAC − AC = 1.415.385 − 552.000 = <b>$863.385</b><br>VAC (variación a la conclusión) = BAC − EAC = 1.200.000 − 1.415.385 = <b>−$215.385</b></div><p><b>ETC</b> es el dinero que todavía hay que conseguir y gastar. <b>VAC</b> es el déficit proyectado al cierre: −17,9% del presupuesto.</p><p>Después de aprobar cambios de alcance, la EAC se recalcula sobre el nuevo BAC; olvidarlo es un error frecuente.</p>'],
['¿Es creíble cumplir?','TCPI: la eficiencia que haría falta','<div class="f">TCPI = (BAC − EV) ÷ (BAC − AC) = 732.000 ÷ 648.000 = <b>1,13</b></div><p>Es el trabajo que falta dividido entre el dinero que queda. Para cumplir los $1.200.000, el equipo tendría que obtener <b>1,13 dólares de valor por cada dólar</b>… cuando hasta hoy ha obtenido 0,85.</p><p>Un salto de 0,28 no es realista. Fleming y Koppelman proponen una regla práctica: si el TCPI supera al CPI en más de <b>0,10</b>, la meta no es creíble y corresponde pronosticar con EAC y pedir una decisión formal.</p>'],
['Comunicar con honestidad','Un rango, no un número','<p>Los estudios de David Christensen sobre cientos de contratos de defensa de EE. UU. mostraron que el CPI acumulado <b>se estabiliza después de cerca del 20% de avance</b>: rara vez mejora mucho después. Además, la EAC calculada con el CPI tiende a ser un <b>piso optimista</b> del costo final.</p><p>Por eso un consultor comunica un rango con su supuesto:</p><div class="note k">“El costo final más probable está entre $1,33M y $1,55M, con $1,42M como valor central si la eficiencia actual se mantiene. Cumplir $1,20M exigiría una eficiencia que no hemos demostrado. Necesitamos decidir entre ampliar presupuesto, reducir alcance o una combinación.”</div>']]});

TOPICS.push({id:'i5',m:'I',n:'1.5',t:'Cronograma ganado: medir el tiempo en tiempo',idea:'El SPI mide el tiempo con <b>dinero</b> y al final siempre vuelve a 1. El cronograma ganado lo mide en <b>meses</b> y conserva la verdad.',map:['El defecto del SPI','La pregunta de Lipke','Algoritmo ES','SPI(t) y SV(t)','IEAC(t)'],
svg:()=>{let s='';
 const a1=axes({xa:1,xb:13,ya:.8,yb:1.05,xt:[1,3,5,7,9,11,13].map(v=>[v,'M'+v]),yt:[[.8,'0,80'],[.9,'0,90'],[1,'1,00']],xl:'Mes (el plan terminaba en el 12)',b:90});

 const cv=[0,40,100,180,290,410,540,680,820,950,1060,1140,1200],ax=axes({xa:0,xb:14,ya:0,yb:1300,xt:[0,2,4,6,8,10,12,14].map(v=>[v,'M'+v]),yt:[[0,'$0'],[400,'$400k'],[800,'$800k'],[1200,'$1,2M']],xl:'Mes'});
 const es=5+58/130;let b=ax.s+P(pts(cv.map((v,i)=>[i,v]),ax.X,ax.Y),{c:K.g2,w:5})+T(ax.X(9.2),ax.Y(1010),'PV planificado',{s:16,w:800,c:K.g2});

   `<g transform="translate(0,250)">`+R(560,70,300,210,{f:'#fff',s:K.ink,sw:2,rx:14})+T(580,100,'Zoom: meses 5 y 6',{s:14,w:900,c:K.mut})+L(590,240,840,240,{w:2})+Ci(600,220,7,{f:K.ink})+Ci(830,110,7,{f:K.ink})+L(600,220,830,110,{c:K.g2,w:3})+T(600,262,'PV₅=410',{a:'middle',s:14,w:800})+T(830,262,'PV₆=540',{a:'middle',s:14,w:800})+Ci(600+230*58/130,220-110*58/130,8,{f:K.red})+T(600+230*58/130,220-110*58/130-14,'468',{a:'middle',s:14,w:900,c:K.red})+T(720,140,'58 de 130 → 0,45',{a:'middle',s:15,w:900,c:K.red})+'</g>',3);

steps:[
['El problema','El SPI “miente” al final','<p>El SPI compara dinero ganado con dinero planificado. Pero cuando el proyecto termina, todo el trabajo está hecho: <b>EV = PV = BAC</b>. Entonces el SPI vale exactamente <b>1,00</b>… aunque el proyecto haya llegado un mes tarde.</p><p>En la gráfica, el proyecto debía terminar en el mes 12 y terminó en el 13. La línea gris del SPI sube y sube hasta 1,00, como si todo estuviera bien. Justo cuando más importa la fecha, el indicador pierde la capacidad de alertar.</p>'],
['La solución','Cronograma ganado (Lipke, 2003)','<p>Walt Lipke propuso cambiar la pregunta. En lugar de “¿cuánto dinero gané frente al planificado?”, preguntar:</p><div class="note"><b>¿En qué momento del plan debía haber logrado el valor que hoy he ganado?</b></div><p>La respuesta se mide en <b>meses</b>, no en dólares. Su índice, el <b>SPI(t)</b>, mantiene la señal real hasta el final (0,92 en el ejemplo). Vandevoorde y Vanhoucke (2006) compararon métodos de pronóstico de duración y encontraron que el cronograma ganado es el más confiable, sobre todo en la segunda mitad del proyecto.</p>'],
['Paso 1','Lleva el valor ganado a la curva del plan','<p>Volvemos a AURORA Pay en el mes 6, con EV = $468.000.</p><p>Sobre la curva S del valor planificado se traza una línea horizontal a la altura de $468.000. Donde corta la curva está el momento del plan que corresponde a lo que hoy está hecho.</p><p>Gráficamente es inmediato. Para calcularlo con precisión, se usa un algoritmo de dos pasos.</p>'],
['Paso 2','El algoritmo: encontrar C e interpolar','<ol><li>Encuentra <b>C</b>: el último mes completo cuyo PV acumulado es menor o igual al EV. Como PV₅ = 410 ≤ 468 y PV₆ = 540 &gt; 468, entonces <b>C = 5</b>.</li><li>Interpola la fracción del mes siguiente: de los 130 que el plan ganaba en el mes 6, ya llevamos 58.</li></ol><div class="f">ES = C + (EV − PV<sub>C</sub>) ÷ (PV<sub>C+1</sub> − PV<sub>C</sub>)<br>ES = 5 + (468 − 410) ÷ (540 − 410) = 5 + 0,45 = <b>5,45 meses</b></div><p>Lo hecho hoy correspondía, según el plan, al día 14 del mes 6.</p>'],
['Paso 3','Índice y variación en tiempo','<div class="f">SPI(t) = ES ÷ AT = 5,45 ÷ 6 = <b>0,91</b><br>SV(t) = ES − AT = 5,45 − 6 = <b>−0,55 meses</b> ≈ 2,4 semanas</div><p><b>AT</b> (Actual Time) es el tiempo real transcurrido. SV(t) se expresa en tiempo, y eso facilita la comunicación: “vamos 2,4 semanas atrasados” se entiende en cualquier comité; “SV = −$72.000” no.</p>'],
['Paso 4','¿Cuándo terminaremos?','<div class="f">IEAC(t) = PD ÷ SPI(t) = 12 ÷ 0,91 = <b>13,2 meses</b></div><p><b>PD</b> es la duración planificada; IEAC(t), la estimación independiente de la duración final. A este ritmo, AURORA terminaría en el mes 13.</p><p>Un detalle: en el mes 6 el SPI tradicional (0,87) exageraba el atraso, porque la curva S es muy empinada a mitad del proyecto. Al final ocurre lo contrario: el SPI lo esconde. El SPI(t) es consistente en ambos momentos. Aun así, también es un agregado: siempre se complementa con la ruta crítica.</p>']]});

steps:[
['Pronosticar con datos','Velocidad: un rango, no un número','<p>La <b>velocidad</b> es la cantidad de puntos de historia que un equipo termina por iteración. Sirve para pronosticar <b>dentro del mismo equipo</b>, nunca para comparar equipos (cada uno estima con su propia escala).</p><p>AURORA terminó 26, 30, 22 y 28 puntos en sus últimos sprints. Quedan 439 puntos. En vez de dividir por el promedio y anunciar “16,6 sprints”, un pronóstico honesto usa el mejor y el peor ritmo observados: <b>entre 15 y 20 sprints</b>.</p>'],
['Dos gráficos, dos historias','Burndown frente a burnup','<p>En el sprint 5 entraron <b>80 puntos</b> nuevos al release.</p><ul><li>El <b>burndown</b> (trabajo restante en el tiempo) deja de bajar: parece que el equipo se frenó.</li><li>El <b>burnup</b> separa dos líneas: lo completado sigue subiendo al mismo ritmo y lo que creció fue el <b>alcance</b>.</li></ul><p>El burnup lleva a la conversación correcta con el sponsor: el problema no es la velocidad, es el alcance que cambia. Si solo se muestra el burndown, el equipo carga con una culpa que no es suya.</p>'],
['Ver el flujo','Diagrama de flujo acumulado (CFD)','<p>El CFD apila, semana a semana, cuántos ítems hay en cada estado: por hacer, en curso y hecho. Su lectura es geométrica:</p><ul><li>La <b>distancia vertical</b> de la banda “en curso” es el <b>WIP</b> (trabajo en curso).</li><li>La <b>distancia horizontal</b> entre la entrada y la salida es, aproximadamente, el <b>tiempo de entrega</b>.</li><li>Una banda que se <b>ensancha</b> revela un cuello de botella: entra más de lo que sale.</li></ul><p>Anderson (2010) lo popularizó en Kanban como el instrumento principal para gestionar el flujo.</p>'],
['Una ley sencilla','Ley de Little','<div class="f">Tiempo de entrega promedio = WIP promedio ÷ Throughput promedio</div><p>El hub de QA en Bengaluru tiene <b>24 historias en curso</b> y termina <b>8 por semana</b>. Cada historia espera, en promedio, 24 ÷ 8 = <b>3 semanas</b>.</p><p>La ley (Little, 1961) se cumple en cualquier sistema estable: una fila de banco, un hospital, un equipo de software. Su consecuencia práctica es poderosa…</p>'],
['La consecuencia','Menos trabajo empezado, menos espera','<p>Si el equipo <b>limita el WIP a 12</b> historias y mantiene su capacidad de 8 por semana:</p><div class="f">12 ÷ 8 = <b>1,5 semanas</b></div><p>El tiempo de entrega se reduce a la mitad <b>sin que nadie trabaje más rápido</b>. Menos tareas abiertas significa menos cambios de contexto, menos esperas entre personas y defectos detectados antes.</p><p>Por eso los tableros Kanban ponen un número máximo encima de cada columna.</p>'],
['Comunicar tiempos','Percentiles, no promedios','<p>Los tiempos de ciclo casi nunca son simétricos: la mayoría de historias sale rápido, pero unas pocas tardan muchísimo (dependencias, bloqueos, retrabajo). Esa <b>cola larga</b> hace que el promedio engañe.</p><p>Daniel Vacanti (2015) recomienda comprometer percentiles: “el <b>85%</b> de nuestras historias se termina en <b>9 días o menos</b>” es una promesa que el equipo cumple en 85 de cada 100 casos. “Tardamos 4,6 días en promedio” se incumplirá casi la mitad de las veces.</p>'],
['Puente con el valor ganado','AgileEVM','<p>Sulaiman, Barton y Blackburn (2006) mostraron que en Scrum se puede calcular valor ganado usando el <b>release como línea base</b>:</p><div class="f">EV = (puntos “hechos” ÷ puntos del release) × BAC<br>EV = 281 ÷ 720 × 1.200.000 = <b>$468.333</b></div><p>Es prácticamente el mismo valor que se obtuvo midiendo paquete por paquete. Con él se calculan CPI y SPI en un proyecto ágil, y el sponsor recibe el mismo lenguaje financiero sin que el equipo abandone sus prácticas.</p>']]});

steps:[
['Dónde nacen los problemas','Cada capa de prueba atrapa defectos','<p>Todo software introduce defectos. La pregunta de control no es “¿hay defectos?”, sino <b>¿dónde los encontramos?</b> Cada práctica funciona como un filtro: revisión de código, pruebas unitarias, de integración, de aceptación.</p><p>Lo que atraviesa todos los filtros llega a producción, donde es más caro: hay que diagnosticar con usuarios reales, corregir, volver a probar y desplegar de urgencia.</p>'],
['La métrica más predictiva','Eficiencia de remoción de defectos (DRE)','<div class="f">DRE = defectos antes de liberar ÷ (antes + después de liberar)<br>DRE = 180 ÷ (180 + 20) = <b>90%</b><br>Tasa de escape = 1 − DRE = <b>10%</b><br>Densidad escapada = 20 ÷ 48 KLOC = <b>0,42 defectos/KLOC</b></div><p>Capers Jones considera la DRE una de las métricas de calidad más predictivas: los proyectos con DRE alta tienden a cumplir costo y plazo. <b>KLOC</b> son miles de líneas de código; la densidad permite comparar componentes de distinto tamaño.</p>'],
['No todos pesan igual','La severidad cambia la lectura','<p>De los 20 defectos escapados, <b>3 son críticos</b> y afectan pagos. Un conteo plano los mezcla con errores cosméticos y da una falsa sensación de control.</p><p>Por eso los defectos se reportan por severidad (crítico, alto, medio, bajo). Y una regla cultural: <b>nunca castigar a quien reporta defectos</b>. Si reportar trae problemas, los defectos se esconden y el indicador deja de servir.</p>'],
['El préstamo invisible','Deuda técnica','<p>Ward Cunningham (1992) acuñó la metáfora: elegir hoy una solución rápida en lugar de una buena es pedir un <b>préstamo</b>. Los <b>intereses</b> son el esfuerzo extra que cada cambio futuro cuesta mientras la deuda no se pague.</p><p>En la gráfica, el equipo que no paga la deuda empieza produciendo más (32 puntos) y termina produciendo menos de la mitad. El área rayada son los intereses: capacidad perdida.</p><p>La deuda técnica no es un problema “del equipo”: es un <b>riesgo de costo y cronograma</b> del proyecto.</p>'],
['No toda deuda es mala','El cuadrante de Fowler','<p>Martin Fowler clasifica la deuda en dos ejes: <b>deliberada o inadvertida</b>, y <b>prudente o temeraria</b>.</p><ul><li>La <b>deliberada y prudente</b> puede ser una buena decisión de gestión: “lanzamos para la fecha regulatoria y refactorizamos en el sprint 9”, siempre que se <b>registre</b> y se <b>pague</b>.</li><li>La <b>temeraria</b> (“no hay tiempo para diseño”) es la que hunde proyectos.</li><li>La <b>inadvertida y prudente</b> es inevitable: aprendemos haciendo.</li></ul>'],
['Medir la entrega','Las cuatro métricas DORA','<p>El programa de investigación DORA (DevOps Research and Assessment), sintetizado en <i>Accelerate</i> (Forsgren, Humble y Kim, 2018), identificó cuatro indicadores del desempeño de entrega:</p><ul><li><b>Frecuencia de despliegue</b> y <b>tiempo de entrega de cambios</b> (commit → producción): velocidad.</li><li><b>Tasa de fallo de cambios</b> (% de despliegues que causan incidente, rollback o hotfix) y <b>tiempo de restauración</b>: estabilidad.</li></ul><p>AURORA desplegó 6 veces este mes y 1 requirió rollback: 1 ÷ 6 = 16,7% de fallos. Medir solo velocidad sin estabilidad premia correr con los ojos cerrados.</p>'],
['La conexión con el dinero','La calidad de hoy es el costo de mañana','<p>Los indicadores de calidad casi siempre son <b>adelantados</b> del costo. Un defecto escapado genera retrabajo; el retrabajo consume horas que no producen valor nuevo; el costo real sube sin que suba el valor ganado; el CPI cae.</p><p>En AURORA, parte del CPI de 0,85 se explica por ese retrabajo. Invertir en pruebas automatizadas de integración frena el avance unas semanas, pero mejora la DRE de inmediato y el CPI con rezago.</p><div class="note">Ojo con la cobertura: 100% de líneas cubiertas por pruebas no significa calidad si las pruebas no verifican lo importante.</div>']]});

steps:[
['Sistemas sociotécnicos','El número llega al final','<p>Los proyectos de software son sistemas <b>sociotécnicos</b>: personas coordinándose alrededor de código. Cuando algo se rompe en el lado humano, el efecto tarda semanas en aparecer en los números.</p><p>Una cadena típica: horas extra sostenidas → moral baja → alguien clave renuncia → más defectos → el CPI cae. Si solo miramos el CPI, nos enteramos al final de la cadena, cuando corregir es más caro.</p>'],
['Peopleware','Las horas extra se devuelven','<p>DeMarco y Lister (<i>Peopleware</i>) observaron un patrón: las horas extra producen una <b>ganancia inicial</b>, pero si se sostienen, la productividad cae por debajo del nivel original. Llegan los errores, el agotamiento, la rotación.</p><p>Indicadores útiles: <b>% de semanas con horas extra</b>, <b>rotación</b> (salidas del periodo ÷ tamaño promedio del equipo) y encuestas de <b>moral</b> breves y frecuentes (escala 1–5 o 0–100).</p>'],
['Equipos distribuidos','El reloj también es una variable','<p>AURORA trabaja en cuatro husos horarios. Con jornadas de 8:00 a 18:00 locales, <b>Bogotá y Bengaluru no comparten ni una hora</b>: una pregunta enviada desde Bogotá recibe respuesta al día siguiente.</p><p><b>Berlín</b> se cruza con ambos y funciona como puente. Indicadores de cohesión en equipos distribuidos: horas de solapamiento útil, bloqueos escalados a tiempo y participación de cada hub en las ceremonias. El modelo <i>follow-the-sun</i> aprovecha las diferencias, pero exige traspasos muy disciplinados.</p>'],
['Interesados','La brecha de involucramiento','<p>La <b>matriz de evaluación del involucramiento</b> compara, para cada interesado, su nivel <b>actual (A)</b> y el <b>deseado (D)</b>: desconocedor, reticente, neutral, partidario o líder.</p><p>La distancia entre ambos es el indicador. El sponsor del banco pasó de partidario a <b>neutral</b> tras dos informes con retraso; necesitamos que sea líder. La acción no es “convencerlo”: es una sesión de alineación con datos honestos y un plan creíble.</p>'],
['Riesgo','Exposición: el riesgo en dinero','<div class="f">Exposición = Σ (probabilidad × impacto) de los riesgos abiertos</div><p>AURORA tiene tres riesgos abiertos: el retraso de la API del banco en Brasil (30% × $40.000 = $12.000), la rotación en QA (25% × $30.000 = $7.500) y un nuevo requisito regulatorio en Colombia (40% × $50.000 = $20.000).</p><p>Exposición total: <b>$39.500</b>. Reserva de contingencia restante: <b>$38.000</b>. No alcanza. Es una alerta temprana que justifica escalar <b>antes</b> de que los riesgos se materialicen. También importa la tendencia del registro: ¿se cierran riesgos o aparecen nuevos de alta severidad?</p>'],
['Reservas','¿Corre la reserva más rápido que el proyecto?','<div class="f">Índice de consumo = % de reserva usada ÷ % de avance (EV ÷ BAC)<br>= 60% ÷ 39% = <b>1,54</b></div><p>La reserva de contingencia era $96.000 (8% del BAC); se han usado $58.000. Con un índice de 1,54, la reserva se agota <b>una vez y media más rápido</b> que el avance del proyecto.</p><p>Si el índice es mayor que 1, hay que revisar qué riesgos se materializaron, si quedan riesgos sin cobertura y escalar. La reserva de gestión no se libera automáticamente: la autoriza la dirección.</p>'],
['El matiz cultural','Silencio no es acuerdo','<p>En culturas con mayor <b>distancia jerárquica</b> (Hofstede) o con estilo de <b>desacuerdo indirecto</b> (Erin Meyer, <i>The Culture Map</i>), las malas noticias tardan en subir y el silencio en una reunión no significa acuerdo.</p><p>Por eso los indicadores adelantados de personas se recogen con <b>canales seguros</b>: encuestas anónimas, conversaciones uno a uno, preguntas por escrito antes de la reunión. Y se usan para <b>cuidar el sistema</b>, nunca para vigilar a las personas: medir para controlar a alguien produce ocultamiento.</p>']]});

steps:[
['Tres tipos de información','Estado, progreso y pronóstico','<p>Un informe de desempeño responde tres preguntas distintas:</p><ul><li><b>Estado</b>: ¿dónde estamos hoy? (CV, SV, CPI, SPI(t)).</li><li><b>Progreso</b>: ¿qué logramos en este periodo? (valor ganado del mes, entregables aceptados, velocidad).</li><li><b>Pronóstico</b>: ¿hacia dónde vamos? (EAC, IEAC(t), TCPI, el P80 de una simulación).</li></ul><p>Los informes que solo muestran estado dejan al sponsor mirando por el retrovisor. Los que más sirven para decidir son los de pronóstico.</p>'],
['Una audiencia, un tablero','No todos necesitan lo mismo','<p>El mismo tablero para todos no sirve a nadie:</p><ul><li><b>Sponsor y comité</b> (mensual): 5–7 KPI con tendencia, pronóstico en rango y las <b>decisiones que se le piden</b>.</li><li><b>Project Manager</b> (semanal): índices, riesgos, solicitudes de cambio, capacidad por hub.</li><li><b>Equipo</b> (diario o por sprint): burndown, WIP, bloqueos, defectos abiertos.</li></ul><p>Cuanto más arriba en la pirámide, menos números y más decisiones.</p>'],
['Equilibrio','Cuadro de mando equilibrado','<p>Kaplan y Norton (1996) propusieron equilibrar perspectivas para no optimizar solo la financiera. Aplicado a un proyecto:</p><ul><li><b>Finanzas</b>: CPI, EAC.</li><li><b>Cliente</b>: satisfacción, valor entregado.</li><li><b>Procesos</b>: SPI(t), DRE, tasa de fallos.</li><li><b>Aprendizaje</b>: moral, cohesión, deuda técnica.</li></ul><p>Un proyecto que solo mira finanzas puede “ahorrar” recortando pruebas y pagar el doble en el cuadrante de procesos.</p>'],
['Colores con reglas','Umbrales aprobados y tendencia','<p>Los colores del semáforo deben derivarse de <b>umbrales aprobados por la gobernanza</b>, no de la opinión de quien reporta. Así el comité solo atiende lo que sale de la banda de tolerancia: <b>gestión por excepción</b>.</p><p>Y siempre se muestra la <b>tendencia</b> de al menos tres periodos. Los dos proyectos tienen hoy CPI = 0,93, pero no son iguales: A viene cayendo cinco meses seguidos y va hacia la zona roja; B se recupera. El punto aislado engaña.</p>'],
['Una trampa clásica','El proyecto sandía','<p>Verde por fuera, rojo por dentro. Durante meses todo se reporta en verde y, de pronto, se anuncia un retraso de cuatro meses.</p><p>Ocurre cuando los umbrales no están definidos, la medición es subjetiva o <b>reportar rojo se castiga</b>. Entonces cada nivel “suaviza” un poco el color al pasarlo hacia arriba. La cura no es técnica sino cultural: premiar la alerta temprana.</p>'],
['Cuando la medida se vuelve meta','Ley de Goodhart','<p>“Cuando una medida se convierte en objetivo, deja de ser una buena medida” (Goodhart, 1975).</p><p>Si se premia al equipo por su velocidad, los puntos se inflan: cada historia “vale” más, la velocidad sube… y las funcionalidades entregadas siguen iguales. El número mejora, el resultado no.</p><p>Parientes cercanos: las <b>métricas de vanidad</b>, números que siempre suben (líneas de código, commits) y no informan ninguna decisión.</p>'],
['Todo junto','El tablero del sponsor y el mensaje ejecutivo','<p>Seis KPI, cuatro perspectivas, tendencia de tres meses y colores con umbrales. Y debajo, lo más importante: <b>tres frases</b>.</p><div class="note k">(1) <b>Estado:</b> el proyecto gana 85 centavos por dólar y va 2,4 semanas atrasado.<br>(2) <b>Causa principal:</b> retrabajo por deuda técnica en la integración de pagos.<br>(3) <b>Decisión requerida:</b> aprobar una de tres opciones de recuperación antes del día 15.</div><p>Un tablero sin decisión pedida es solo un informe. Uno con decisión pedida es una herramienta de gobierno.</p>']]});

steps:[
['La incertidumbre inicial','El cono de incertidumbre','<p>Al comienzo de un proyecto sabemos muy poco. Boehm (1981) y McConnell (2006) mostraron que una estimación hecha en la fase de idea puede quedar entre <b>0,25× y 4×</b> del valor real: un proyecto “de $1,2M” podría terminar costando $0,3M o $4,8M.</p><p>La incertidumbre se reduce a medida que se <b>toman decisiones</b> y se construye: con el diseño aprobado, el rango ya es de 0,8× a 1,25×. Pero no se reduce sola: se reduce decidiendo. Y cada decisión nueva, cada aprendizaje, puede traer un cambio.</p>'],
['De dónde viene el cambio','Siete fuentes típicas','<ul><li><b>Requisitos que emergen</b> al usar el producto: los usuarios del piloto piden pagar con QR.</li><li><b>Regulación</b>: una nueva exigencia de autenticación reforzada.</li><li><b>Defectos</b>: una vulnerabilidad crítica obliga a rediseñar el control de acceso.</li><li><b>Riesgos materializados</b>: el proveedor de integración se retrasa.</li><li><b>Mercado</b>: un competidor lanza remesas sin comisión.</li><li><b>Tecnología</b>: aparece un componente open source maduro.</li><li><b>Nuevos interesados</b>: llega un sponsor con otras prioridades.</li></ul><p>Ninguna es un error de gestión. El error sería no tener cómo procesarlas.</p>'],
['Medir el cambio','Volatilidad de requisitos','<div class="f">Volatilidad = (añadidos + modificados + eliminados) ÷ requisitos de la línea base</div><p>AURORA aprobó 240 requisitos. En 6 meses hubo 22 añadidos, 18 modificados y 6 eliminados: 46 ÷ 240 = <b>19,2%</b>, es decir, <b>3,2% por mes</b>.</p><p>Capers Jones ha reportado crecimientos del orden de <b>1–2% mensual</b> en proyectos típicos. AURORA duplica ese rango: es una señal para revisar la calidad de la elicitación o la estabilidad del caso de negocio.</p>'],
['El verdadero problema','Los cambios que no pasan por el proceso','<p>De los 22 requisitos nuevos, <b>15 llegaron por canales informales</b>: reuniones con el sponsor, mensajes, pasillo. Nadie registró una solicitud, nadie analizó su impacto, nadie ajustó presupuesto ni cronograma.</p><p>Resultado: el equipo ejecuta trabajo que <b>no está en la línea base</b>. Ese trabajo consume horas (sube el costo real) pero no suma valor ganado planificado. Es una de las causas del CPI de 0,85.</p><p>El diagnóstico no es “hay demasiados cambios”, sino “<b>los cambios no pasan por el proceso</b>”.</p>'],
['¿Cuánto cuesta cambiar tarde?','La curva del costo del cambio y su debate','<p>Boehm (1981) mostró que corregir un error de requisitos detectado en producción podía costar decenas de veces más que corregirlo en la fase de requisitos (hasta ~100× en grandes sistemas).</p><p>Kent Beck (1999) argumentó que prácticas como pruebas automatizadas, integración continua y refactorización <b>aplanan</b> esa curva. Y Laurent Bossavit (2012) revisó la evidencia: los multiplicadores exactos se han repetido sin respaldo suficiente.</p><p>Lo que sí es robusto: un cambio tardío casi siempre toca más componentes, más pruebas y más interesados.</p>'],
['La conclusión útil','Hacer barato el cambio y decidir cuándo','<p>El objetivo del control de cambios <b>no es evitar el cambio</b>. Congelar requisitos en un dominio que evoluciona produce un producto que nadie quiere. Aceptar todo cambio sin medir produce un proyecto que nunca termina.</p><p>Hay dos palancas:</p><ul><li><b>Técnica</b>: hacer que cambiar sea barato (automatización, diseño modular, refactorización).</li><li><b>De gestión</b>: decidir <b>cuándo</b> incorporar cada cambio, con información de impacto y por un proceso formal.</li></ul><p>La segunda palanca es el tema de las siguientes cinco secciones.</p>']]});

steps:[
['Qué significa “integrado”','Un cambio mueve todo','<p>Un cambio nunca afecta una sola cosa. Añadir pagos con QR mueve el <b>alcance</b>, pero también el <b>cronograma</b> (¿toca la ruta crítica?), el <b>costo</b>, la <b>calidad</b> (más pruebas de regresión), el <b>riesgo</b> (nueva certificación), los <b>recursos</b> (¿qué hub lo hace?), los <b>interesados</b> y la <b>configuración</b> del software.</p><p>Por eso el control de cambios se llama <b>integrado</b>: cada solicitud se analiza en todos los ejes a la vez, y la decisión se refleja en todas las líneas base y documentos afectados.</p>'],
['Pasos 1 y 2','Identificar y registrar','<p><b>1 · Identificar:</b> cualquier interesado puede pedir un cambio. El 1 de marzo, el gerente comercial de Bogotá solicita pagos QR porque “la competencia ya lo tiene”.</p><p><b>2 · Registrar:</b> el PM o la oficina de proyectos le asigna un <b>ID único</b> (CR-007) en el registro de cambios, con fecha y solicitante.</p><p>Parece burocracia, pero sin un ID no hay trazabilidad: dentro de seis meses nadie sabrá por qué el alcance creció.</p>'],
['Paso 3','Analizar el impacto','<p>Del día 2 al 6, el PM reúne a arquitectura (Bogotá), mobile (Bengaluru) y seguridad (Berlín). Resultado:</p><ul><li>+$48.000 de costo directo y 4 semanas-equipo.</li><li>Toca la <b>ruta crítica</b>: el motor de pagos.</li><li>Requiere una certificación adicional con la red de pagos.</li></ul><p>Este análisis es tan importante que tiene su propia sección (2.3). Sin él, el comité decidiría a ciegas.</p>'],
['Paso 4','Decidir','<p>Decide quien tenga la <b>autoridad</b> según el tamaño del cambio (sección 2.4): el PM, el comité de cambios o el comité directivo.</p><p>Las salidas posibles son más que “sí o no”: <b>aprobar</b>, <b>aprobar con condiciones</b> (fecha, presupuesto adicional, alcance reducido), <b>diferir</b> a una versión posterior, <b>rechazar</b> o <b>intercambiar alcance</b> (entra esto, sale algo de tamaño similar y menor valor).</p><p>El día 8, el comité <b>difiere con condiciones</b> CR-007: irá en la versión 1.1, con presupuesto adicional aprobado por el sponsor.</p>'],
['Pasos 5, 6 y 7','Actualizar, comunicar y verificar','<p><b>5 · Actualizar:</b> se ajustan líneas base, plan, backlog, documentos y elementos de configuración. Aprobar sin actualizar deja los indicadores midiendo contra un plan falso.</p><p><b>6 · Comunicar:</b> el solicitante recibe la decisión <b>y su justificación</b>, incluso si es un rechazo.</p><p><b>7 · Verificar:</b> en la semana 30, QA y auditoría comprueban que la versión 1.1 implementa exactamente lo aprobado. Solo entonces CR-007 se cierra. Olvidar este paso es la razón por la que “lo aprobado” y “lo construido” suelen no coincidir.</p>'],
['La vida de una solicitud','Estados','<p>Cada solicitud atraviesa estados explícitos: <b>Registrada → En análisis → Aprobada, Diferida o Rechazada → En implementación → Verificada → Cerrada</b>.</p><p>Una solicitud diferida vuelve a análisis cuando llega su momento. Una rechazada se cierra, pero con su justificación registrada. Los estados permiten responder en cualquier momento: ¿cuántas solicitudes esperan decisión? ¿cuánto tiempo llevan esperando?</p>'],
['Quién decide','El comité de control de cambios (CCB)','<p>El <b>CCB</b> (Change Control Board) es un grupo formalmente constituido para revisar, evaluar, aprobar, diferir o rechazar cambios.</p><p>En un proyecto de software suele incluir: representante del sponsor o cliente, Project Manager, Product Owner, arquitecto, líder de QA, seguridad y cumplimiento, y operaciones. Cada rol aporta una mirada que los otros no tienen: valor, plan, producto, diseño, calidad, riesgo regulatorio, operación.</p><p>Su autoridad y sus umbrales se definen en el plan de gestión de cambios.</p>'],
['El formulario mínimo','Qué debe tener una solicitud','<p>Un formulario no es papeleo si cada campo sirve para decidir:</p><ul><li><b>ID, fecha, solicitante</b>: trazabilidad.</li><li><b>Descripción y justificación</b>: ¿qué problema u oportunidad resuelve?</li><li><b>Tipo, prioridad y urgencia</b>: define la ruta y el nivel de autoridad.</li><li><b>Requisitos y componentes afectados</b> e <b>impacto estimado</b>.</li><li><b>Alternativas consideradas</b>.</li><li><b>Decisión, responsable, condiciones y comunicación</b>.</li></ul><p>Los errores típicos: cambios aprobados por chat sin registro, un comité que solo aprueba (o solo rechaza) sin análisis, y rechazos que nunca se comunican.</p>']]});

steps:[
['La pregunta central','Si aprobamos esto, ¿qué cambia y qué ganamos?','<p>El análisis de impacto es el corazón del control de cambios. Recorre una lista de dimensiones para no olvidar ninguna:</p><ul><li><b>Alcance</b>: requisitos, historias y paquetes que se añaden o modifican.</li><li><b>Cronograma</b>: ¿toca la ruta crítica, un hito contractual o regulatorio?</li><li><b>Costo</b>: directo y ajustado por el desempeño real.</li><li><b>Calidad</b>: pruebas de regresión, componentes con deuda técnica.</li><li><b>Riesgo</b>: qué riesgos crea y cuáles elimina.</li><li><b>Recursos</b>: qué habilidades y qué hub.</li><li><b>Configuración</b>: componentes, interfaces y versiones.</li><li><b>Valor</b>: quién gana, quién pierde, beneficio de negocio.</li></ul>'],
['Paso 1','Qué se toca: la trazabilidad','<p>CR-007 se traduce en cuatro requisitos (REQ-PAY-031 a 034). La <b>matriz de trazabilidad</b> conecta cada requisito con los componentes que lo implementan: app móvil, motor de pagos, antifraude y pruebas PCI-DSS.</p><p>Sin trazabilidad, nadie sabe qué componentes toca un cambio hasta que algo se rompe. Con ella, el impacto se calcula en minutos (Wiegers y Beatty, <i>Software Requirements</i>).</p>'],
['Paso 2','El ajuste que casi nadie hace','<p>El equipo estima <b>4 semanas-equipo, $48.000</b> de costo directo. Esa estimación supone que el trabajo nuevo se hará con eficiencia de plan.</p><p>Pero el proyecto obtiene 0,848 dólares de valor por cada dólar gastado. No hay razón para creer que el trabajo nuevo será más eficiente que el existente:</p><div class="f">Costo esperado = 48.000 ÷ 0,848 = <b>$56.600</b></div><p>Presentar $48.000 al comité es presentar un número que el propio desempeño del proyecto contradice.</p>'],
['Paso 3','El efecto en los indicadores','<div class="f">Nuevo BAC = 1.200.000 + 48.000 = <b>$1.248.000</b><br>Nueva EAC = 552.000 + (1.248.000 − 468.000) ÷ 0,848 = <b>$1.472.000</b><br>Nuevo TCPI = (1.248.000 − 468.000) ÷ (1.248.000 − 552.000) = <b>1,12</b></div><p>El presupuesto crece $48.000, pero el costo final esperado crece casi $57.000. Y el TCPI de 1,12 sigue siendo inalcanzable con un CPI de 0,85: el cambio agrava una meta que ya no es creíble.</p>'],
['Paso 4','Cronograma: ¿toca la ruta crítica?','<p>El motor de pagos está en la <b>ruta crítica</b>: la secuencia de actividades sin holgura que define la fecha de lanzamiento. Agregarle trabajo empuja todo lo que viene después: certificación y lanzamiento se mueven <b>2 semanas</b>.</p><p>La alternativa sería ejecutarlo en paralelo (fast tracking), pero con más riesgo de retrabajo. Si el cambio solo tocara actividades con holgura, el impacto en la fecha podría ser cero.</p>'],
['Paso 5','Riesgo y valor en la balanza','<p>Aprobar crea un riesgo nuevo: otra certificación con la red de pagos. Pero <b>rechazar también tiene riesgo</b>: la competencia ya ofrece QR y el área comercial valora el cambio en 8/10.</p><p>Un análisis honesto pone ambos lados en la balanza. Un análisis que solo mira el costo empuja siempre a rechazar; uno que solo mira el valor empuja siempre a aprobar.</p>'],
['La recomendación','Siempre hay más de dos opciones','<p>El consultor no lleva al comité un “sí o no”. Lleva opciones con su costo:</p><ul><li><b>No aprobar dentro del release 1.0</b>: agravaría un TCPI irreal y movería la fecha.</li><li><b>Opción A · Diferir</b> a la versión 1.1 con $56.600 adicionales aprobados por el sponsor.</li><li><b>Opción B · Intercambiar alcance</b>: retirar “modo oscuro” (valor 3/10, $40.000) y absorber la diferencia.</li></ul><p>El comité decide; el análisis hace que la decisión sea informada y defendible.</p>']]});

steps:[
['Cuatro propósitos','Tipos de solicitud','<ul><li><b>Acción preventiva</b>: reduce la probabilidad de un desempeño negativo <b>futuro</b>. Pruebas de carga antes de una temporada de alto tráfico.</li><li><b>Acción correctiva</b>: realinea el desempeño <b>después</b> de una desviación. Asignar un especialista al módulo atrasado; reordenar el backlog para atacar la ruta crítica.</li><li><b>Reparación de defecto</b>: corrige un producto que no cumple sus requisitos. Una vulnerabilidad de control de acceso.</li><li><b>Actualización</b>: modifica documentos, planes o alcance. Una funcionalidad nueva.</li></ul><p>Las acciones correctivas y preventivas no siempre cambian la línea base, pero si consumen presupuesto, tiempo o reservas, <b>deben pasar por el proceso</b>.</p>'],
['Lo que no se discute','Obligatorios frente a discrecionales','<p>Un cambio <b>obligatorio</b> (legal, regulatorio, contractual) no se discute en el <b>qué</b>: si el regulador exige autenticación reforzada, se hará. Pero sí se gestiona el <b>cuándo</b> y el <b>cómo</b>: plazos de entrada en vigor, prórrogas, alcance mínimo, en qué versión.</p><p>Un cambio <b>discrecional</b> compite por valor con todo lo demás del backlog. Tratar un obligatorio como opcional es un riesgo legal; tratarlo como si no tuviera opciones de implementación es desperdiciar margen de maniobra.</p>'],
['Cuando no se puede esperar','El procedimiento de emergencia','<p>Un incidente crítico en producción no puede esperar al comité mensual. Para eso se define, <b>de antemano</b>, un procedimiento de emergencia: un subgrupo autorizado aprueba de inmediato, se implementa, y después el comité completo revisa y documenta.</p><p>Sin este procedimiento ocurre lo peor de ambos mundos: o el sistema queda expuesto esperando una reunión, o la etiqueta “urgente” se convierte en la excusa para saltarse el control cada semana.</p>'],
['Quién aprueba qué','La matriz de autoridad','<p>La gobernanza fija umbrales. En AURORA Pay:</p><ul><li><b>Project Manager</b>: menos de $10.000 y menos de una semana, sin tocar hitos.</li><li><b>Comité de cambios</b>: $10.000 a $50.000, 1 a 4 semanas; puede usar reserva de contingencia.</li><li><b>Comité directivo</b>: más de $50.000, más de 4 semanas, cambios regulatorios, re-baseline o reserva de gestión.</li></ul><p>Fíjate en CR-007: por costo ($48.000) le correspondería al comité de cambios, pero <b>mueve el lanzamiento</b>, así que sube al comité directivo. La regla es: decide el nivel más alto que cualquier criterio active.</p>'],
['El contrato importa','Precio fijo frente a tiempo y materiales','<p>En un contrato de <b>precio fijo</b>, cada cambio de alcance se formaliza además como una <b>orden de cambio</b> contractual: si no se negocia, el proveedor absorbe el costo.</p><p>En un contrato por <b>tiempo y materiales</b>, el impacto recae directamente en el presupuesto del cliente: cada hora se factura.</p><p>Por eso el tipo de contrato cambia quién tiene más incentivo a controlar el alcance y cómo se redacta el plan de gestión de cambios.</p>']]});

steps:[
['Dos preguntas distintas','Qué cambia y qué versión existe','<p>El control de cambios responde <b>qué</b> cambia y quién lo autorizó. Pero en software hay una segunda pregunta igual de importante: <b>¿qué versión exacta de qué componente</b> existe, dónde está desplegada y qué cambios incluye?</p><p>Esa es la <b>gestión de configuración</b> (IEEE 828; ISO 10007; Sommerville). Sin ella, el comité puede aprobar algo perfecto que luego se implementa en otra versión, en otro ambiente o mezclado con trabajo no aprobado.</p>'],
['El ciclo','Cuatro funciones','<ul><li><b>Identificación</b>: define cuáles son los elementos de configuración y cómo se versionan.</li><li><b>Control de cambios de configuración</b>: ningún elemento de una línea base cambia sin autorización (ramas protegidas, revisión obligatoria).</li><li><b>Contabilidad del estado</b>: registra el estado y la historia de cada elemento: qué versión está en cada ambiente y qué solicitudes incluye.</li><li><b>Auditoría</b>: verifica la coherencia entre lo aprobado, lo documentado y lo entregado.</li></ul>'],
['Qué se controla','Elementos de configuración','<p>Un <b>elemento de configuración</b> (EC) es cualquier pieza que define el producto y cuya versión importa: requisitos, código fuente, scripts de base de datos, infraestructura como código, archivos de configuración, documentación, builds.</p><p>Un error frecuente es considerar solo el código. Un cambio en un script de base de datos o en una variable de configuración de producción puede romper el sistema igual que un cambio de código, y debe pasar por el mismo control.</p>'],
['De punta a punta','Trazabilidad','<p>La conexión clave entre gestión de proyectos y gestión de configuración es incluir el <b>ID de la solicitud</b> en todo: requisitos, nombre de la rama, mensajes de commit, pull request y notas de versión.</p><p>Así, ante una auditoría o un incidente, se responde en minutos: ¿quién pidió esto? ¿quién lo aprobó? ¿qué código lo implementa? ¿en qué versión salió? Sin el ID, la respuesta es una arqueología de semanas.</p>'],
['En el repositorio','Ramas, pull requests y versiones','<p>La rama <i>feature/CR-007-pagos-qr</i> se crea <b>solo después</b> de la aprobación del comité: trabajo sin solicitud aprobada es trabajo fuera de la línea base.</p><p>El <b>pull request</b> funciona como un mini comité técnico: revisión de arquitectura y seguridad (Berlín) y pruebas automatizadas en verde. Al fusionarse en <i>main</i>, se etiqueta la versión <b>v1.1.0</b>.</p>'],
['Comunicar con números','Versionado semántico','<div class="f">MAYOR . MENOR . PARCHE</div><ul><li><b>PARCHE</b>: corrección compatible. 1.0.3 → 1.0.4.</li><li><b>MENOR</b>: funcionalidad nueva compatible. Sube el menor y el parche vuelve a 0.</li><li><b>MAYOR</b>: cambio incompatible: quien use la versión anterior tendrá que adaptarse.</li></ul><p>Un interesado que lee “2.0.0” sabe que algo se rompe; uno que lee “1.0.4” sabe que solo se corrigió algo.</p>'],
['Pagos QR','1.0.4 → 1.1.0','<p>CR-007 agrega una funcionalidad nueva que no rompe nada de lo existente: es un cambio <b>MENOR</b>. La versión pasa de 1.0.4 a <b>1.1.0</b>.</p><p>El número de versión se convierte en un mensaje para todos los interesados: hay algo nuevo, y lo anterior sigue funcionando.</p>'],
['Verificar lo entregado','Auditoría física y funcional','<p>Antes de cerrar CR-007 se hacen dos auditorías:</p><ul><li><b>Física</b>: ¿lo desplegado en producción coincide exactamente con el manifiesto de la versión? QA encuentra una librería (<i>fastqr</i>) que no estaba aprobada. Se bloquea la liberación hasta registrarla.</li><li><b>Funcional</b>: ¿cumple los requisitos? Los cuatro requisitos pasan sus criterios de aceptación.</li></ul><p>Solo entonces la solicitud se cierra. Saltarse la auditoría física es liberar algo distinto de lo que se probó.</p>']]});

steps:[
['Tres cosas que no son lo mismo','Cambio aprobado, scope creep y gold plating','<ul><li><b>Cambio aprobado</b>: pasó por control y ajustó línea base, presupuesto y plan.</li><li><b>Scope creep</b> (corrupción del alcance): trabajo que entra, normalmente desde afuera (cliente, sponsor), <b>sin ajustar</b> tiempo ni costo. “Es una cosita más”.</li><li><b>Gold plating</b>: extras de origen <b>interno</b> que nadie pidió. Un desarrollador agrega animaciones “porque se ven mejor” y consume dos semanas.</li></ul><p>Los dos últimos consumen presupuesto sin pasar por el control y pueden introducir defectos. Pequeños cambios informales suman meses.</p>'],
['Ágil','El triángulo invertido','<p>En el enfoque predictivo se fija el <b>alcance</b> y se estiman tiempo y costo: los cambios de alcance pasan por el comité.</p><p>En ágil se fijan <b>tiempo y costo</b> (la duración del sprint, el tamaño del equipo) y el <b>alcance es la variable</b> de ajuste. El Manifiesto Ágil valora “responder al cambio sobre seguir un plan”, pero eso <b>no significa ausencia de control</b>: el control se desplaza al backlog.</p>'],
['El backlog como control','Intercambiar en lugar de sumar','<p>El Product Owner prioriza continuamente el backlog y protege el objetivo del sprint en curso: no se interrumpe un sprint por cada solicitud nueva.</p><p>Cuando llega algo nuevo, la pregunta no es “¿lo agregamos?” sino “<b>¿qué sale para que esto entre?</b>”. Pagos QR (8 puntos, alto valor) entra; Modo oscuro (8 puntos, bajo valor) sale. El tamaño del release no cambia, el valor sí.</p>'],
['Contratos ágiles','“Cambio gratis” y “dinero por nada”','<p>Jeff Sutherland propuso dos cláusulas contractuales:</p><ul><li><b>Cambio gratis</b>: el cliente puede cambiar prioridades sin costo si intercambia alcance de tamaño equivalente, como acabamos de ver.</li><li><b>Dinero por nada</b>: el cliente puede terminar antes cuando el valor de lo que queda es bajo, pagando una fracción de lo pendiente.</li></ul><p>Ambas convierten la flexibilidad en algo explícito y negociado, en lugar de una fuente de conflicto.</p>'],
['Proyectos híbridos','Reglas claras de quién decide','<p>AURORA es híbrido: fases predictivas de cumplimiento regulatorio y Scrum en el desarrollo. Necesita reglas explícitas:</p><ul><li>Reordenar historias sin cambiar el tamaño total: <b>Product Owner</b>.</li><li>Intercambiar historias de tamaño similar: <b>Product Owner</b>, informando al comité.</li><li>Agregar historias que aumentan el release: <b>comité de cambios</b>.</li><li>Cambiar la fecha de lanzamiento o el presupuesto: <b>comité directivo</b>.</li></ul>'],
['Re-baseline mal usada','Cuando la nueva línea base esconde la historia','<p>En el mes 7, con CPI 0,85, un PM propone una nueva línea base tomando el valor ganado actual como planificado. Al mes siguiente el SPI marca <b>1,00</b> y el sponsor cree que el problema desapareció.</p><p>Un informe honesto muestra las dos lecturas: SPI contra la nueva línea base 1,00; <b>SPI(t) contra la original 0,91</b>; costo final esperado <b>+18%</b> sobre el presupuesto original.</p><p>En valor ganado formal, cuando el nuevo presupuesto supera al del contrato se habla de <b>OTB</b> (Over Target Baseline).</p>'],
['Re-baseline bien usada','Cuándo y cómo','<p>Cuando la desviación es tan grande que la línea base ya no sirve para controlar, aprobar una nueva es legítimo, por ejemplo tras un cambio mayor de alcance o una reestructuración.</p><p>Reglas del consultor: aprobación de la gobernanza, causas documentadas, conservar la línea base original y <b>reportar contra ambas</b> durante un tiempo. Borrar la original o re-baselinear para maquillar indicadores es ocultar información a quien decide.</p>']]});

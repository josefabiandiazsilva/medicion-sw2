steps:[
['Antes de actuar','Síntoma no es causa','<p>Un CPI de 0,85 dice que <b>algo</b> está mal. No dice <b>qué</b>. Y la acción correcta depende por completo de la causa:</p><ul><li>Si el sobrecosto viene de retrabajo por deuda técnica, las horas extra lo <b>empeoran</b>: más horas cansadas producen más defectos.</li><li>Si viene de un bloqueo externo (una API que no llega), contratar más personas no ayuda: tendrán que esperar igual.</li></ul><p>El orden es siempre: <b>diagnóstico antes que prescripción</b>.</p>'],
['¿Ruido o señal?','Causas comunes','<p>Walter Shewhart (1931) distinguió dos tipos de variación. La de <b>causas comunes</b> es propia del sistema: pequeñas fluctuaciones mes a mes que no tienen una explicación particular.</p><p>El <b>gráfico de control</b> lo hace visible: se grafica el CPI de <b>cada mes</b> (no el acumulado, que suaviza tanto que esconde las señales), su media y límites en media ± 3 desviaciones estándar (LCS y LCI).</p><p>Si todos los puntos quedan dentro de los límites, lo que vemos es ruido. No hay nada que “corregir” en el mes 6 por haber bajado de 0,958 a 0,953.</p>'],
['La señal','Causas especiales','<p>Una <b>causa especial</b> es atribuible a un evento identificable: la salida de una persona clave, una multa, un proveedor que falló. En el mes 11 el CPI cae a 0,905, fuera del límite inferior: eso sí es una señal que merece investigación.</p><p>Reglas habituales de señal:</p><ul><li>Un punto fuera de los límites.</li><li>Siete o más puntos seguidos del mismo lado de la media.</li><li>Una tendencia sostenida de seis puntos.</li></ul>'],
['El error contrario','Reaccionar al ruido empeora las cosas','<p>W. Edwards Deming lo demostró con su <b>experimento del embudo</b>: se dejan caer canicas a través de un embudo hacia un blanco. Si después de cada tiro se mueve el embudo para “corregir” el error del tiro anterior, la dispersión <b>aumenta</b>.</p><p>En gestión se llama <b>tampering</b>: un PM que cambia de estrategia cada mes porque el CPI fluctuó entre 0,93 y 0,98, dentro de sus límites, introduce más variación de la que corrige. Con ruido, se mejora el sistema o el nivel medio; no se reacciona a cada punto.</p>'],
['Herramienta 1','Los cinco porqués','<p>Técnica de Taiichi Ohno (Toyota): preguntar “¿por qué?” sucesivamente hasta llegar a una causa sobre la que se pueda <b>actuar</b>. Detenerse en el primer porqué (“el equipo es lento”) es buscar culpables en lugar de causas del sistema.</p><p><b>Causa raíz accionable:</b> el backlog no reserva capacidad para calidad. <b>Acción preventiva:</b> reservar el 10% de la capacidad de cada sprint para automatizar pruebas, y llevarlo al comité de cambios porque afecta el avance.</p>'],
['Herramienta 2','Diagrama de Ishikawa','<p>El diagrama de espina de pescado organiza las <b>causas posibles</b> por categorías antes de investigar. Para software, categorías útiles son: personas, proceso, herramientas y tecnología, requisitos, proveedores y entorno, gestión.</p><p>Su valor es evitar la visión de túnel: obliga al equipo a considerar causas fuera de su área antes de quedarse con la primera hipótesis.</p>'],
['Herramienta 3','Pareto: pocas causas, mucho efecto','<p>Se ordenan las causas por frecuencia o impacto y se grafica su porcentaje acumulado. Casi siempre, unas pocas explican la mayor parte del problema.</p><p>De los 20 defectos escapados de AURORA, 9 vienen de <b>requisitos ambiguos</b> y 6 de la <b>falta de pruebas de integración</b>: atacar esas dos causas cubre el <b>75%</b> del problema. Ese es el lugar donde invertir primero.</p>']]});

steps:[
['El mapa de opciones','Cada opción compra algo y cuesta algo','<p>Cuando un proyecto se atrasa, las opciones típicas son seis. Ninguna es gratis:</p><ul><li><b>Crashing</b> (agregar recursos a la ruta crítica): compra tiempo, cuesta dinero.</li><li><b>Fast tracking</b> (paralelizar): compra tiempo, cuesta riesgo de retrabajo.</li><li><b>Horas extra</b>: compra tiempo a corto plazo, cuesta moral, errores y rotación.</li><li><b>Más personas</b>: compra capacidad… tarde.</li><li><b>Reducir alcance</b>: compra tiempo y dinero, cuesta valor.</li><li><b>Mejorar el proceso</b>: compra eficiencia futura, cuesta avance inmediato.</li></ul>'],
['Crashing','La pendiente de costo','<p>La integración con la red de pagos dura 6 semanas y cuesta $60.000. Con dos especialistas adicionales podría durar 4 semanas y costar $84.000.</p><div class="f">Pendiente = (costo comprimido − costo normal) ÷ (duración normal − comprimida)<br>= (84.000 − 60.000) ÷ (6 − 4) = <b>$12.000 por semana</b></div><p>¿Conviene? Depende del <b>costo de demora</b> (Reinertsen, 2009): cuánto cuesta cada semana de retraso del lanzamiento (ingresos no percibidos, penalidades, ventana de mercado). Si es $20.000/semana, comprimir 2 semanas cuesta $24.000 y evita $40.000: conviene. Si fuera $8.000/semana, no.</p>'],
['Una regla fundamental','Solo la ruta crítica mueve la fecha','<p>La <b>ruta crítica</b> es la cadena de actividades sin holgura. Comprimir una actividad que <b>no</b> está en ella gasta dinero sin adelantar el lanzamiento: la app móvil tiene 2 semanas de holgura, así que acelerarla no cambia nada.</p><p>Se comprimen primero las actividades <b>críticas con menor pendiente</b>, y solo mientras la pendiente sea menor que el costo de demora.</p>'],
['Fast tracking','Hacer en paralelo lo que iba en secuencia','<p>En lugar de esperar a que termine el desarrollo para probar, se empieza a probar antes. El calendario se acorta de 12 a 9 semanas con poco gasto adicional.</p><p>El precio es el <b>riesgo</b>: se prueba algo que todavía está cambiando, y parte de ese trabajo tendrá que rehacerse. Solo funciona con dependencias “blandas”, donde la segunda actividad puede avanzar con información parcial.</p>'],
['Ley de Brooks','Más gente, más tarde','<p>“Agregar personas a un proyecto de software atrasado lo atrasa más” (Fred Brooks, <i>The Mythical Man-Month</i>, 1975). Dos mecanismos:</p><ul><li>Los recién llegados consumen tiempo de los expertos mientras aprenden: durante semanas, la productividad del equipo <b>baja</b>.</li><li>Los canales de comunicación crecen cuadráticamente: n × (n − 1) ÷ 2.</li></ul><div class="f">6 personas → 15 canales · 10 personas → 45 canales</div><p>Pasar el backend de 6 a 10 personas en el mes 9, con 3 meses restantes, probablemente tenga efecto neto negativo.</p>'],
['Horas extra','Un préstamo con intereses','<p>Las horas extra dan una ganancia inicial real. Pero si se sostienen, la productividad cae por debajo del nivel de partida: errores, agotamiento, rotación. DeMarco y Lister observan que el tiempo extra suele compensarse después con menor productividad.</p><p>Como acción puntual de una o dos semanas pueden servir. Como estrategia permanente, destruyen justo lo que se intentaba proteger.</p>'],
['Reducir alcance','MoSCoW','<p>La técnica <b>MoSCoW</b> clasifica el alcance en <b>Must</b> (debe tener), <b>Should</b> (debería), <b>Could</b> (podría) y <b>Won’t</b> (no por ahora).</p><p>Retirar lo “Could have” (modo oscuro, reportes extra) compra tiempo y dinero a cambio de valor. Es frecuentemente la opción más eficiente, pero exige negociar con los interesados y pasar por el comité de cambios: recortar alcance a escondidas es tan grave como agregarlo a escondidas.</p>']]});

steps:[
['Qué es un riesgo','Amenazas y oportunidades','<p>Un riesgo es un evento <b>incierto</b> que, si ocurre, afecta un objetivo del proyecto. Se describe con dos dimensiones: <b>probabilidad</b> e <b>impacto</b>.</p><p>No todos los riesgos son malos. Un componente open source maduro o los asistentes de IA para programar son <b>oportunidades</b>: eventos inciertos que, si ocurren, benefician al proyecto. David Hillson defendió tratarlas con el mismo rigor que las amenazas: no aprovechar una oportunidad también es una decisión con costo.</p>'],
['Las estrategias','Dos columnas en espejo','<p><b>Para amenazas:</b> <b>escalar</b> (supera la autoridad del proyecto), <b>evitar</b> (eliminar la causa), <b>transferir</b> (contrato con penalidad, seguro, cobertura cambiaria), <b>mitigar</b> (reducir probabilidad o impacto) o <b>aceptar</b> (de forma activa con una reserva, o pasiva).</p><p><b>Para oportunidades:</b> <b>escalar</b>, <b>explotar</b> (asegurar que ocurra), <b>compartir</b> (aliarse con quien mejor la captura), <b>mejorar</b> (subir su probabilidad) o <b>aceptar</b>.</p><p>Elegir siempre “mitigar” por reflejo es uno de los errores más comunes.</p>'],
['Comparar con números','Costo esperado de cada respuesta','<div class="f">Costo esperado total = costo de la respuesta + probabilidad residual × impacto residual</div><ul><li><b>Aceptar</b>: 0 + 0,30 × 40.000 = <b>$12.000</b>.</li><li><b>Mitigar</b> con simuladores ($5.000), la probabilidad baja a 10%: 5.000 + 0,10 × 40.000 = <b>$9.000</b>.</li><li><b>Transferir</b> con penalidad ($2.000 de negociación), el banco cubre $25.000 del impacto: 2.000 + 0,30 × 15.000 = <b>$6.500</b>.</li></ul><p>Transferir tiene el menor costo esperado… pero los números no cuentan toda la historia.</p>'],
['Lo que deja y lo que crea','Riesgo residual y secundario','<p>El <b>riesgo residual</b> es lo que queda después de responder: transferir no evita el retraso, solo cambia quién paga parte de él.</p><p>El <b>riesgo secundario</b> es el que la propia respuesta crea: aplicar una penalidad a un aliado estratégico tensa la relación. Una cobertura cambiaria crea riesgo de contraparte.</p><p>Por eso la recomendación combina: <b>transferir</b> para proteger el presupuesto y <b>mitigar parcialmente</b> con simuladores para que el equipo no se detenga.</p>'],
['Saber cuándo actuar','Disparadores y planes de contingencia','<p>Un <b>disparador</b> es la señal concreta que indica que el riesgo está por materializarse y activa el plan de contingencia.</p><p>En AURORA: “Si al día 10 del mes la API de pruebas del banco no está disponible, se activa el plan de simuladores”. Si la contingencia también falla, existe un <b>plan de reserva</b> (fallback).</p><p>Sin disparador definido de antemano, la contingencia se activa cuando el problema ya es evidente, es decir, tarde. Y los riesgos que nunca se revisan convierten el registro de riesgos en un documento muerto.</p>']]});

steps:[
['La idea','Valor monetario esperado','<div class="f">EMV = Σ (probabilidad × resultado)</div><p>Una apuesta: 50% de ganar $100 y 50% de perder $40. Su EMV es 0,5 × 100 + 0,5 × (−40) = <b>+$30</b>.</p><p>Ojo: nunca vas a “ganar $30”. Vas a ganar 100 o perder 40. El EMV es lo que obtendrías <b>en promedio</b> si repitieras la apuesta muchas veces. Por eso es una buena guía para una organización que toma muchas decisiones parecidas, y una guía incompleta para una decisión única y grande.</p><p>Convención: costos o amenazas con un signo, beneficios con otro. Lo importante es ser <b>consistente</b>.</p>'],
['Estructura','Nodos de decisión','<p>AURORA debe resolver la conexión con la red de pagos inmediatos. Tres alternativas:</p><ul><li><b>Construir</b> un conector propio: $70.000.</li><li>Contratar un <b>agregador SaaS</b>: $95.000.</li><li>Usar un <b>SDK open source</b> con soporte de un aliado: $55.000.</li></ul><p>En un árbol de decisión, el <b>cuadrado</b> es un nodo de decisión: allí <b>tú eliges</b> una rama.</p>'],
['El azar','Nodos de azar y hojas','<p>Cada alternativa puede tener problemas que generan costo adicional. Eso se representa con un <b>círculo</b>: un nodo de azar, donde “la naturaleza elige” con probabilidades que deben sumar 100%.</p><ul><li>Construir: 35% de problemas, +$60.000.</li><li>SaaS: 10% de problemas, +$30.000.</li><li>Open source: 50% de problemas, +$80.000.</li></ul><p>Las <b>hojas</b> (extremo derecho) son el resultado final de cada camino.</p>'],
['El procedimiento','Rodar hacia atrás','<p>El árbol se resuelve <b>de derecha a izquierda</b>: en cada nodo de azar se calcula el EMV; en cada nodo de decisión se elige la rama con mejor EMV (aquí, el menor costo).</p><div class="f">Construir: 70 + 0,35 × 60 = <b>$91k</b><br>SaaS: 95 + 0,10 × 30 = <b>$98k</b><br>Open source: 55 + 0,50 × 80 = <b>$95k</b></div><p>Por EMV gana <b>construir</b>.</p>'],
['El límite del EMV','Aversión al riesgo y minimax','<p>El EMV supone <b>neutralidad al riesgo</b>: trata igual una pérdida segura de $90.000 que una apuesta con 50% de perder $180.000.</p><p>Una organización con poca capacidad de absorber sorpresas puede preferir el <b>menor peor caso</b> (criterio minimax): construir puede llegar a $130k; SaaS, a $125k; open source, a $135k. Gana el <b>SaaS</b>.</p><p>Con un CPI de 0,85 y la reserva casi agotada, un consultor podría recomendar el SaaS y explicar que paga $7.000 de EMV a cambio de reducir la variabilidad. Ambas respuestas son defendibles si se declara el criterio.</p>'],
['Comprar información','Valor de la información','<p>Antes de decidir se puede “comprar información”: un prototipo, una prueba de concepto. Vale la pena si su costo es menor que la mejora esperada de la decisión.</p><p>Una prueba de concepto de dos semanas ($6.000) que reduzca al 15% la probabilidad de problemas al construir:</p><div class="f">70 + 0,15 × 60 + 6 = <b>$85k</b></div><p>Mejor que todas las alternativas. Es la lógica detrás de las pruebas de concepto técnicas en las primeras semanas de un proyecto: reducir incertidumbre antes de comprometer mucho dinero.</p>']]});

steps:[
['Cuando el dinero no basta','Criterios múltiples','<p>AURORA debe recuperar el cronograma. Elegir “la opción más barata” ignoraría el plazo, la calidad, el riesgo regulatorio y la relación con el banco aliado.</p><p>La <b>matriz de decisión ponderada</b> hace explícitos todos los criterios a la vez. Su procedimiento:</p><ol><li>Definir alternativas realistas (incluida “no hacer nada”).</li><li>Definir criterios <b>independientes</b> entre sí (costo y presupuesto contarían dos veces lo mismo).</li><li>Asignar pesos.</li><li>Puntuar.</li><li>Calcular y hacer análisis de sensibilidad.</li></ol>'],
['Paso 3','Los pesos van primero','<p>Con el sponsor se acuerdan los pesos: costo 30%, plazo 25%, calidad 20%, riesgo 15% e interesados 10%.</p><p>El orden importa: los pesos se fijan <b>antes</b> de puntuar las alternativas. Si se fijan después de ver los resultados, la matriz deja de ser un análisis y se convierte en una justificación de una preferencia previa.</p>'],
['Paso 4','Puntuar con una escala común','<p>Cada alternativa recibe una puntuación de 1 a 5 en cada criterio, donde <b>5 es siempre el mejor efecto</b>. Una escala inconsistente (en un criterio 5 es mejor y en otro peor) invalida el resultado.</p><p>Reducir alcance obtiene 5 en costo y plazo (ahorra ambos) pero 2 en interesados (el sponsor pierde funcionalidades). Las horas extra obtienen 4 en plazo pero 2 en calidad (más errores).</p>'],
['Paso 5','Ponderar','<div class="f">Puntaje ponderado = Σ peso × puntuación</div><p>Reducir alcance: 0,30×5 + 0,25×5 + 0,20×4 + 0,15×4 + 0,10×2 = <b>4,35</b>. Fast tracking: 3,20. Horas extra: 2,70. Más personal: 2,10.</p><p>Con los pesos del sponsor, reducir alcance gana con claridad.</p>'],
['Paso 6','Análisis de sensibilidad','<p>¿Y si el sponsor valora mucho más la relación con los interesados? Con interesados en 40% (costo 10%, plazo 15%), las barras se reordenan: <b>reducir alcance cae</b> y las horas extra se acercan.</p><p>Eso no invalida la matriz: muestra que la decisión <b>depende</b> de cuánto pesa la percepción del sponsor, y ese es exactamente el tema que hay que discutir con él. El mayor valor de la matriz está en la conversación sobre los pesos, que revela qué valora cada interesado.</p>'],
['Pesos con más rigor','AHP: comparar de dos en dos','<p>Asignar porcentajes directamente es difícil. El <b>proceso analítico jerárquico</b> (AHP) de Thomas Saaty propone comparar los criterios de dos en dos: “¿cuánto más importa el costo que el plazo?”.</p><p>De esas comparaciones se derivan los pesos y se verifica la <b>consistencia</b> de los juicios: si el costo importa el doble que el plazo y el plazo el doble que la calidad, el costo debería importar cerca de cuatro veces la calidad. Si alguien dice “igual”, hay una incoherencia que discutir.</p>']]});

steps:[
['Más que un número','Estimación de tres puntos','<p>En lugar de un solo número, se estiman tres:</p><ul><li><b>O</b>, optimista: todo sale bien. 4 semanas.</li><li><b>M</b>, más probable: lo normal. 6 semanas.</li><li><b>P</b>, pesimista: aparecen los problemas razonables. 11 semanas.</li></ul><p>La asimetría ya es información: hay más espacio para que las cosas salgan peor (5 semanas por encima de M) que mejor (2 semanas por debajo). En proyectos casi siempre es así.</p>'],
['La distribución','PERT','<div class="f">Media PERT = (O + 4M + P) ÷ 6 = (4 + 24 + 11) ÷ 6 = <b>6,5 semanas</b><br>Desviación ≈ (P − O) ÷ 6 = 7 ÷ 6 = <b>1,17 semanas</b><br>Triangular: (O + M + P) ÷ 3 = 7</div><p>La media queda <b>por encima</b> del valor más probable porque la cola derecha es larga. Comprometer “6 semanas” (el más probable) tiene <b>menos de 50%</b> de probabilidad de cumplirse.</p><p>El método PERT nació en 1958 en el programa Polaris de la Armada de EE. UU. (Malcolm et al., 1959).</p>'],
['La simulación','Monte Carlo en cinco pasos','<ol><li>Modelar las variables inciertas con distribuciones: duraciones, productividad, CPI de cada periodo, tipo de cambio.</li><li>Tomar un valor al azar de cada variable.</li><li>Calcular el resultado del proyecto con esos valores: <b>un proyecto posible</b>.</li><li>Repetir miles de veces.</li><li>Analizar la distribución: histograma, curva acumulada y percentiles.</li></ol><p>Cada punto que cae es un proyecto simulado. Juntos dibujan qué tan probable es cada resultado. Si las variables comparten una causa común (la misma deuda técnica afecta varias tareas), hay que modelar esa correlación: ignorarla subestima el riesgo.</p>'],
['Leer el resultado','P50 y P80','<p>La curva acumulada dice qué probabilidad hay de terminar <b>en o antes</b> de cada mes:</p><ul><li><b>P50</b> = mes 13: la mitad de los escenarios termina antes. Comprometer el P50 es aceptar un 50% de probabilidad de incumplir.</li><li><b>P80</b> = mes 14: el 80% termina antes.</li><li>El plan original (mes 12) tiene apenas <b>22%</b> de probabilidad.</li></ul><p>Las simulaciones con <b>datos reales del proyecto</b> (productividad y CPI observados) son más confiables que las basadas solo en estimaciones iniciales: el cono de incertidumbre ya se estrechó.</p>'],
['De la distribución a la decisión','Dimensionar la reserva','<div class="f">Reserva sugerida = valor al percentil elegido − estimación determinista<br>Costo: 1.470.000 − 1.200.000 = <b>$270.000</b> · Plazo: 14 − 12 = <b>2 meses</b></div><div class="note k"><b>Mensaje:</b> “Con 80% de confianza el proyecto terminará en 14 meses o menos y costará $1,47M o menos. Recomendamos comprometer el mes 14 ante el banco y solicitar $270.000 adicionales, o reducir alcance para volver a una probabilidad aceptable con el presupuesto actual.”</div><p>Error clásico: sumar las estimaciones pesimistas de todas las tareas. Es casi imposible que todas fallen a la vez, y el resultado sobreestima.</p>'],
['Corregir el optimismo','Pronóstico por clase de referencia','<p>Bent Flyvbjerg propone comparar el proyecto con la distribución <b>real</b> de proyectos similares ya terminados, en lugar de confiar solo en estimaciones internas.</p><p>En TI, Flyvbjerg y Budzier (2011) encontraron <b>colas muy largas</b>: una fracción de proyectos sufre sobrecostos extremos, mucho mayores que el promedio. Por eso, en proyectos de software, el P80 o el P90 importan más que la media: la pregunta no es “¿cuánto costará en promedio?”, sino “¿qué tan mal puede salir y con qué probabilidad?”.</p>']]});

 s+=G(L(80,300,820,300,{w:4})+Ci(160,300,18,{f:K.ink})+T(160,260,'Mes 6 · HOY',{a:'middle',s:17,w:900})+`<path d="M760,250 l0,-60 l40,15 l-40,15" fill="${K.red}"/>`+L(760,300,760,190,{w:3})+T(760,345,'Mes 15: “AURORA fue cancelado”',{a:'middle',s:16,w:900,c:K.red})+P('M740,240 C600,140 330,140 190,260',{c:K.red,w:3,m:'ar',d:'10 8',cls:'dr'})+T(470,130,'¿Qué pasó? (respuestas anónimas)',{a:'middle',s:17,w:900})+
   ['La certificación PCI-DSS se retrasó por la deuda técnica','Bengaluru sabía de los defectos y no lo escaló','El sponsor perdió la confianza por informes optimistas'].map((r,i)=>G(R(120+i*230,380,220,120,{f:K.pink,s:K.red,rx:12})+wrapT(230+i*230,420,r.match(/.{1,24}(\s|$)/g).map(x=>x.trim()),{a:'middle',s:13.5,w:700,lh:20}),2,{x:` style="transition-delay:${.6+i*.2}s"`})).join(''),2,{out:3});
 s+=G([['RESPONSABILIDAD','asumir decisiones y consecuencias'],['RESPETO','escuchar a todos los hubs'],['EQUIDAD','decidir sin favoritismos'],['HONESTIDAD','reportar la verdad, también el rojo']].map((v,i)=>{const x=50+(i%2)*410,y=70+Math.floor(i/2)*200;return R(x,y,390,170,{f:i===3?K.red:'#fff',s:i===3?K.red:K.ink,sw:3,rx:18})+T(x+195,y+75,v[0],{a:'middle',s:24,w:900,c:i===3?'#fff':K.ink})+T(x+195,y+115,v[1],{a:'middle',s:16,w:700,c:i===3?'#fff':K.mut})}).join('')+T(450,520,'Código de Ética y Conducta Profesional del PMI',{a:'middle',s:17,w:800,c:K.mut}),3,{out:4});
 const RA=[['Análisis de impacto','R','I','C','C','C'],['Recomendación','R','I','A','C','I'],['Decisión final','C','A','R','I','I'],['Comunicación','R','A','I','I','I']],CO=['PM','Sponsor','CCB','Arq./QA','Hubs'];

steps:[
['La mente también se equivoca','Sesgos y antídotos','<p>Kahneman y Tversky documentaron errores sistemáticos del juicio humano. En el control de proyectos aparecen siempre los mismos:</p><ul><li><b>Falacia de planificación</b>: “recuperaremos el atraso en el próximo sprint”.</li><li><b>Anclaje</b>: la primera estimación domina todas las siguientes.</li><li><b>Costo hundido</b> y <b>escalada del compromiso</b> (Staw, 1976).</li><li><b>Confirmación</b>: buscar solo los datos que apoyan el plan.</li><li><b>Optimismo del reportante</b>: los indicadores “se redondean” hacia el verde.</li></ul><p>Cada uno tiene un antídoto concreto. El más poderoso es usar datos observados (CPI, SPI(t)) en lugar de intenciones.</p>'],
['El más costoso','Costo hundido','<p>“Ya llevamos 9 meses y $800.000 invertidos; cancelar ahora sería desperdiciarlos.”</p><p>Lo gastado <b>no se recupera</b>, decidas lo que decidas: continuar o parar no cambia esos $800.000. La única comparación válida es hacia adelante: <b>costo restante</b> de continuar frente al <b>beneficio esperado</b> de terminar, contra el costo y beneficio de parar.</p><p>El antídoto organizacional son los <b>puntos de decisión</b> con criterios de terminación definidos de antemano, antes de que exista algo “hundido” que defender.</p>'],
['Imaginar el fracaso','Pre-mortem','<p>Gary Klein (2007) propuso el <b>pre-mortem</b>: imaginar que el proyecto ya fracasó y pedir a cada persona que escriba, en forma anónima, por qué.</p><p>En el mes 6 de AURORA: “Es el mes 15 y el proyecto fue cancelado. ¿Qué pasó?”. Las respuestas de los cuatro hubs revelan riesgos que nadie se atrevía a decir en voz alta: la certificación retrasada por la deuda técnica, defectos conocidos que no se escalaron, informes demasiado optimistas.</p><p>Las tres respuestas se convierten en riesgos con respuesta y en un cambio del proceso de reporte.</p>'],
['Ética','Cuatro valores','<p>El Código de Ética y Conducta Profesional del PMI se basa en cuatro valores: <b>responsabilidad</b>, <b>respeto</b>, <b>equidad</b> y <b>honestidad</b>.</p><p>Maquillar indicadores, retrasar malas noticias o re-baselinear para ocultar desviaciones viola la honestidad y priva a los decisores de la información que necesitan para proteger el proyecto, la organización y a los usuarios.</p><p>Confundir “ser positivo” con ocultar información es uno de los errores más caros de la gestión.</p>'],
['Quién decide','Matriz RACI','<p>Toda decisión importante necesita roles claros:</p><ul><li><b>R</b>, responsable: ejecuta el trabajo.</li><li><b>A</b>, aprobador: rinde cuentas. <b>Uno solo</b> por actividad.</li><li><b>C</b>, consultado: aporta antes de decidir.</li><li><b>I</b>, informado: se entera después.</li></ul><p>Para “aprobar un cambio de más de $50.000”, el sponsor es el aprobador de la decisión final, el comité es responsable de ella y el PM es responsable del análisis. Sin un único aprobador, “todos y nadie” deciden. Y conviene documentar la justificación: al año nadie recuerda por qué se decidió.</p>'],
['Decidir entre culturas','Consenso o jerarquía','<p>Erin Meyer muestra que las culturas de trabajo difieren en <b>cómo</b> deciden. En Alemania o Japón tiende a predominar el <b>consenso</b>: se decide lento, pero se implementa rápido y sin reabrir la discusión. En otras culturas el líder decide rápido y la decisión se ajusta en el camino.</p><p>Hofstede añade que con mayor distancia jerárquica es menos probable que alguien contradiga al jefe en público.</p><p>Prácticas útiles en un equipo como AURORA: aclarar al inicio <b>cómo</b> se decidirá, recoger opiniones por escrito o anónimas antes de la reunión y documentar la decisión y su justificación. Son tendencias de grupos, no rasgos de cada persona.</p>']]});

 return[`<section class="full" id="ciclo" data-where="El ciclo de control"><div style="display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:4vw;align-items:center;width:100%;max-width:1400px" class="cyc"><div><div class="kick rv">Mapa de la unidad</div><h2 class="big rv d1" style="font-size:clamp(3rem,7vw,6.4rem)">UN CICLO QUE SE REPITE <span class="red">CADA MES</span></h2><p class="lede rv d2">Seguir y controlar un proyecto no es mirar números: es recorrer, una y otra vez, el camino que va de la <b>medición</b> a la <b>decisión</b>. Primero medimos con rigor; luego diagnosticamos si la desviación es ruido o señal; decidimos con evidencia; si la decisión cambia el plan, la gobernamos con control de cambios; y actualizamos la referencia para volver a medir.</p><p class="lede rv d3" style="color:var(--muted)">Los tres módulos de esta unidad son las tres piezas de ese ciclo.</p></div><div class="vbox rv d2" id="cycViz" style="box-shadow:none;background:transparent"></div></div></section>`,s]}
function caseScene(){const hubs=[['Bogotá','PMO y backend',-74,4.7],['São Paulo','Integración PIX y UX',-46.6,-23.5],['Berlín','Seguridad PSD2',13.4,52.5],['Bengaluru','Apps móviles y QA',77.6,13]];
 const lon0=10,lat0=10,R0=230,cx=330,cy=300,pr=(lon,lat)=>{const l=(lon-lon0)*Math.PI/180,p=lat*Math.PI/180,p0=lat0*Math.PI/180;return[cx+R0*Math.cos(p)*Math.sin(l),cy-R0*(Math.cos(p0)*Math.sin(p)-Math.sin(p0)*Math.cos(p)*Math.cos(l))]};
 let g=Ci(cx,cy,R0,{f:'#fff',s:K.ink,sw:3});for(let lo=-180;lo<180;lo+=30){let d='';for(let la=-80;la<=80;la+=5){const[x,y]=pr(lo,la);const vis=Math.cos(la*Math.PI/180)*Math.cos((lo-lon0)*Math.PI/180)>-0.05;d+=(d&&vis?'L':'M')+x.toFixed(1)+','+y.toFixed(1)+' '}g+=P(d,{c:'#e3e3e3',w:1.2})}
 for(let la=-60;la<=60;la+=30){let d='';for(let lo=-80;lo<=100;lo+=5){const[x,y]=pr(lo,la);d+=(d?'L':'M')+x.toFixed(1)+','+y.toFixed(1)+' '}g+=P(d,{c:'#e3e3e3',w:1.2})}
 const P2=hubs.map(h=>pr(h[2],h[3]));const arcs=[[0,1],[0,2],[2,3],[1,2],[0,3]].map(([a,b])=>{const A=P2[a],B=P2[b],mx=(A[0]+B[0])/2,my=(A[1]+B[1])/2-60;return P(`M${A[0]},${A[1]} Q${mx},${my} ${B[0]},${B[1]}`,{c:K.red,w:2.5,cls:'dr flow2'})}).join('');
 g+=G(arcs,0)+hubs.map((h,i)=>G(Ci(P2[i][0],P2[i][1],18,{f:K.red,cls:'pulse'})+Ci(P2[i][0],P2[i][1],9,{f:K.ink,s:'#fff',sw:3})+R(P2[i][0]+(i===3?-150:16),P2[i][1]-34,134,46,{f:K.ink,rx:10})+T(P2[i][0]+(i===3?-140:26),P2[i][1]-14,h[0],{s:15,w:900,c:'#fff'})+T(P2[i][0]+(i===3?-140:26),P2[i][1]+3,h[1],{s:10.5,w:600,c:'#ccc'}),0,{x:` style="transition-delay:${.5+i*.2}s"`})).join('');
 const nums=[['BAC · presupuesto total',1200000],['PV · planificado a hoy',540000],['EV · ganado a hoy',468000],['AC · gastado a hoy',552000]];
 g+=nums.map((n,i)=>G(R(620,70+i*120,260,100,{f:i===2?K.red:i===3?K.ink:'#fff',s:K.ink,sw:2,rx:14})+T(640,104+i*120,n[0].toUpperCase(),{s:12,w:900,c:i>=2?'#ffd6d8':K.mut})+T(640,150+i*120,CNT(n[1],'m'),{s:32,w:900,c:i>=2?'#fff':K.ink}),0,{x:` style="transition-delay:${1+i*.2}s"`})).join('');
 return[`<section class="full soft" id="caso" data-where="El caso AURORA Pay"><div style="display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.3fr);gap:4vw;align-items:center;width:100%;max-width:1400px" class="cyc"><div><div class="kick rv">El caso que recorre toda la unidad</div><h2 class="big rv d1" style="font-size:clamp(3.4rem,8vw,7rem)">AURORA <span class="red">PAY</span></h2><p class="lede rv d2">Una billetera móvil de pagos inmediatos y remesas, construida en 12 meses por equipos en <b>cuatro países</b>, bajo normas exigentes de seguridad (PCI-DSS) y de pagos (PSD2).</p><p class="lede rv d3">Estamos en el <b>mes 6</b>. Con solo cuatro números vamos a descubrir que el proyecto gasta más de lo que avanza, cuánto costará en realidad, cuánto vale un cambio que pide el sponsor y qué opciones de recuperación existen.</p><p class="rv d4" style="font-size:.85rem;color:var(--muted)">Proyecto ficticio, construido con regulaciones, tecnologías y riesgos reales con fines formativos.</p></div><div class="vbox rv d2" id="caseViz" style="box-shadow:none;background:transparent"></div></div></section>`,g]}
function endScene(){return`<section class="end" id="fin" data-where="Cierre" data-dark="1"><div class="kick rv" style="color:#ff9aa0">Cierre de la unidad</div><h2 class="rv d1">MEDIR · GOBERNAR · <em>DECIDIR</em></h2><p class="lede rv d2" style="color:#ddd">Un proyecto de software no se controla con intuición ni con optimismo: se controla con una referencia aprobada, indicadores que avisan a tiempo, un proceso que decide qué cambia y por qué, y decisiones que comparan alternativas con evidencia.</p>
 <div class="recap">${MODS.map((m,i)=>`<div class="rv d${i+1}"><b>${m.n} · ${m.t}</b><p>${['Valor ganado (PV, EV, AC), índices CPI y SPI(t), pronósticos EAC y TCPI, métricas ágiles, de calidad, de personas y de riesgo, y tableros con umbrales.','Volatilidad, proceso integrado de cambios, análisis de impacto ajustado por el desempeño real, niveles de autoridad, configuración y re-baseline.','Ruido y señal, causa raíz, opciones de recuperación, respuestas a riesgos, EMV, multicriterio, PERT y Monte Carlo, sesgos y gobernanza.'][i]}</p></div>`).join('')}</div>
 <div style="display:flex;gap:.7rem;flex-wrap:wrap;margin-top:3rem" class="rv d3"><button class="pill dark" style="border:2px solid #fff;padding:.7rem 1.3rem;font-weight:800;color:#fff;background:transparent;border-radius:99px" onclick="openRefs()">Referencias bibliográficas</button><button style="border:2px solid #fff;padding:.7rem 1.3rem;font-weight:800;color:#fff;background:transparent;border-radius:99px" onclick="openCtx()">Ubicación en la Guía PMBOK® 8</button><button style="border:0;padding:.7rem 1.3rem;font-weight:800;color:#fff;background:#E50914;border-radius:99px" onclick="scrollTo({top:0,behavior:'smooth'})">↑ Volver al inicio</button></div>
 <p style="color:#777;font-size:.78rem;margin-top:3rem">Alineado con la Guía PMBOK® 8 (PMI, 2025). PMBOK y PMI son marcas registradas del Project Management Institute.</p></section>`}
function heroHTML(){const w=['LO','QUE','NO','SE','MIDE'];return`<section id="hero" data-where="Inicio"><canvas id="heroCv"></canvas><div class="hero-copy"><div class="kick">Ingeniería de Software II · Seguimiento y control</div><h1>${w.map((x,i)=>`<span class="w" style="animation-delay:${.15+i*.1}s">${x}</span>`).join(' ')}<em>${['NO','SE','CONTROLA'].map((x,i)=>`<span class="w" style="animation-delay:${.75+i*.12}s">${x}</span>`).join(' ')}</em></h1><p>Indicadores, control de cambios y toma de decisiones en proyectos de software, explicados paso a paso con un caso real de principio a fin.</p></div><div class="scrollcue"><i></i>DESLIZA</div><div class="ticker"><div>${['CPI = EV ÷ AC','SPI(t) = ES ÷ AT','EAC = BAC ÷ CPI','TCPI > CPI + 0,10 → meta no creíble','Ley de Little: tiempo = WIP ÷ throughput','Ley de Brooks: más gente, más tarde','Costo esperado de un cambio = estimado ÷ CPI','EMV = Σ probabilidad × resultado','P80 > P50: decide con distribuciones','Lo que no pasa por el comité es scope creep'].map(x=>'<b>●</b>'+x).join('   ')}</div></div></section>`}

let caseSVG='',cycSVG='';
function build(){const cy0=cycleScene();cycSVG=cy0[1];let h=heroHTML()+cy0[0];const cs=caseScene();h+=cs[0];caseSVG=cs[1];RAIL.push(['hero','Inicio',1],['ciclo','El ciclo de control'],['caso','Caso AURORA Pay']);
 MODS.forEach(m=>{h+=modCover(m);RAIL.push(['m-'+m.id,'Módulo '+m.n+' · '+m.t.toLowerCase(),1]);TOPICS.filter(t=>t.m===m.id).forEach(t=>{h+=topicCover(t)+story(t);RAIL.push(['t-'+t.id,t.n+' '+t.t])})});
 h+=endScene();RAIL.push(['fin','Cierre',1]);$('#main').innerHTML=h;
 $('#rail').innerHTML=RAIL.map(r=>`<a href="#${r[0]}" class="${r[2]?'m':''}" data-r="${r[0]}"><span>${r[1]}</span></a>`).join('');
 $('#icol').innerHTML=MODS.map(m=>`<div><h3>${m.n} · ${m.t}</h3>${TOPICS.filter(t=>t.m===m.id).map(t=>`<a href="#t-${t.id}" onclick="closeIndex()"><span>${t.n}</span>${t.t}</a>`).join('')}</div>`).join('');
 // siglas: primera aparición por tema
 TOPICS.forEach(t=>expandAcr($('#s-'+t.id+' .steps')));
}

/* ===================================================================
   OBSERVADORES: aparición, pasos, ubicación, barra
=================================================================== */
function observe(){const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');if(e.target.id==='cycViz'||e.target.id==='caseViz')setViz(e.target._svg,0)}}),{threshold:.15});
 $$('.rv,.mcov').forEach(el=>io.observe(el));
 // montar diagramas cuando se acercan
 const lazy=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){const b=e.target;if(!b._svg){const t=TOPICS.find(x=>x.id===b.dataset.t);b._svg=mountViz(b,t.svg());b._t=t;setViz(b._svg,-1)}lazy.unobserve(b)}}),{rootMargin:'150% 0px'});
 $$('.vbox[data-t]').forEach(b=>lazy.observe(b));
 const so=new IntersectionObserver(es=>es.forEach(e=>{if(!e.isIntersecting)return;const st=e.target,story=st.closest('.story'),k=+st.dataset.i,box=story.querySelector('.vbox');story.querySelectorAll('.step').forEach(x=>x.classList.toggle('act',x===st));
  story.querySelectorAll('.dots i').forEach((d,i)=>{d.className=i===k?'on':i<k?'past':''});if(!box._svg){const t=TOPICS.find(x=>x.id===box.dataset.t);box._svg=mountViz(box,t.svg());box._t=t}setViz(box._svg,k,box._t.hook)}),{rootMargin:'-48% 0px -48% 0px'});
 $$('.step').forEach(s=>so.observe(s));
 const wo=new IntersectionObserver(es=>es.forEach(e=>{if(!e.isIntersecting)return;const el=e.target;$('#where').innerHTML=el.dataset.where.replace(/^([\d.]+)/,'<b>$1</b>');document.body.classList.toggle('ondark',!!el.dataset.dark);
  const id=el.id.startsWith('s-')?'t-'+el.id.slice(2):el.id;$$('#rail a').forEach(a=>a.classList.toggle('on',a.dataset.r===id))}),{rootMargin:'-45% 0px -54% 0px'});
 $$('[data-where]').forEach(s=>wo.observe(s));
 addEventListener('scroll',()=>{const h=document.documentElement;$('#bar').style.width=(h.scrollTop/(h.scrollHeight-h.clientHeight)*100)+'%'},{passive:true})}

   PORTADA 3D (three.js): curva S en columnas
=================================================================== */
function hero3D(){if(typeof THREE==='undefined')return;const cv=$('#heroCv');let r;try{r=new THREE.WebGLRenderer({canvas:cv,antialias:true,alpha:true})}catch(e){return}
 r.setPixelRatio(Math.min(devicePixelRatio,2));const sc=new THREE.Scene(),cam=new THREE.PerspectiveCamera(40,1,.1,200);sc.fog=new THREE.Fog(0xffffff,28,62);
 sc.add(new THREE.HemisphereLight(0xffffff,0xdddddd,.85));const dl=new THREE.DirectionalLight(0xffffff,.7);dl.position.set(8,18,10);sc.add(dl);
 const grp=new THREE.Group();sc.add(grp);const cvp=[40,100,180,290,410,540,680,820,950,1060,1140,1200],ev=[38,90,160,250,350,468,560,660,770,880,990,1100],ac=[40,96,175,275,390,552,670,790,910,1030,1150,1270];
 const mk=(c,o={})=>new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:.55,metalness:.05},o));const bars=[];
 for(let i=0;i<12;i++){[[cvp,0xd6d6d6,-.62],[ev,0xE50914,0],[ac,0x141414,.62]].forEach(([arr,c,dz])=>{const h=arr[i]/150;const g=new THREE.BoxGeometry(.55,1,.55);g.translate(0,.5,0);const m=new THREE.Mesh(g,mk(c));m.position.set(i*1.15-6.3,0,dz);m.scale.y=.001;m.userData={h,d:i*.09+(dz+.62)*.08};grp.add(m);bars.push(m)})}
 const base=new THREE.Mesh(new THREE.BoxGeometry(15,.25,3),mk(0xffffff));base.position.y=-.13;grp.add(base);
 const ring=new THREE.Mesh(new THREE.TorusGeometry(8.5,.05,8,120),mk(0xE50914,{emissive:0x330000}));ring.rotation.x=Math.PI/2;ring.position.y=-.2;grp.add(ring);
 const pts=new THREE.BufferGeometry(),N=500,arr=new Float32Array(N*3);for(let i=0;i<N;i++){arr[i*3]=(Math.random()-.5)*50;arr[i*3+1]=Math.random()*20;arr[i*3+2]=(Math.random()-.5)*50}pts.setAttribute('position',new THREE.BufferAttribute(arr,3));sc.add(new THREE.Points(pts,new THREE.PointsMaterial({color:0xE50914,size:.07,transparent:true,opacity:.5})));
 let mx=0,my=0;addEventListener('pointermove',e=>{mx=e.clientX/innerWidth-.5;my=e.clientY/innerHeight-.5});
 const size=()=>{const w=cv.clientWidth,h=cv.clientHeight;r.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix();grp.position.x=w>900?7.5:0;grp.position.z=w>900?0:-4};size();addEventListener('resize',size);
 const t0=performance.now();let vis=true;new IntersectionObserver(e=>vis=e[0].isIntersecting).observe($('#hero'));
 (function loop(){requestAnimationFrame(loop);if(!vis)return;const t=(performance.now()-t0)/1000;bars.forEach(b=>{const p=Math.min(1,Math.max(0,(t-.6-b.userData.d)/1.4));b.scale.y=Math.max(.001,b.userData.h*(1-Math.pow(1-p,3)))});
  grp.rotation.y=-.55+Math.sin(t*.15)*.25+mx*.4;cam.position.set(0,6+my*3,24);cam.lookAt(grp.position.x*.35,3.2,0);r.render(sc,cam)})()}

/* ===================================================================
   SIGLAS, POPOVER Y MODALES
=================================================================== */
const ACR_SKIP=/^(H1|H2|H3|BUTTON|SCRIPT|STYLE|ABBR|svg|SVG)$/;
function expandAcr(root){if(!root)return;const seen=new Set();const skip=n=>{for(let p=n.parentNode;p&&p!==root.parentNode;p=p.parentNode){if(p.nodeType!==1)continue;if(ACR_SKIP.test(p.tagName)||p.namespaceURI==='http://www.w3.org/2000/svg')return true;if(p.classList&&(p.classList.contains('f')||p.classList.contains('k')))return true}return false};
 const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);const nodes=[];while(w.nextNode()){const n=w.currentNode;ACR_RE.lastIndex=0;if(ACR_RE.test(n.nodeValue)&&!skip(n))nodes.push(n)}
 nodes.forEach(n=>{const s=n.nodeValue;let last=0,m,ch=false;const fr=document.createDocumentFragment();ACR_RE.lastIndex=0;while((m=ACR_RE.exec(s))){if(seen.has(m[1]))continue;seen.add(m[1]);ch=true;fr.appendChild(document.createTextNode(s.slice(last,m.index)));const a=document.createElement('abbr');a.className='t';a.dataset.a=m[1];a.title=m[1]+': '+ACR[m[1]][0];a.textContent=m[1];fr.appendChild(a);last=m.index+m[1].length}if(!ch)return;fr.appendChild(document.createTextNode(s.slice(last)));n.parentNode.replaceChild(fr,n)})}
function showPop(el,html){const p=$('#pop');p.innerHTML=html;p.style.display='block';const r=el.getBoundingClientRect();const pw=Math.min(340,innerWidth-20);let x=r.left;if(x+pw>innerWidth-10)x=innerWidth-pw-10;p.style.left=Math.max(10,x)+'px';p.style.top=(r.bottom+8)+'px';requestAnimationFrame(()=>{if(r.bottom+8+p.offsetHeight>innerHeight-10)p.style.top=Math.max(10,r.top-p.offsetHeight-8)+'px'})}
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(t){e.preventDefault();const A=ACR[t.dataset.a],g=A&&A[2]&&GL[A[2]];showPop(t,`<h4>${t.dataset.a} · ${A[0]}</h4><div style="font-size:.75rem;color:#6d6d6d">En inglés: ${A[1]}</div>${g?`<div style="margin-top:.35rem">${g.d}</div>`:''}`);return}if(!e.target.closest('#pop'))$('#pop').style.display='none'},true);
function openModal(h){$('#modalBody').innerHTML=h;$('#modal').classList.add('on')}
function closeModal(){$('#modal').classList.remove('on')}
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();closeIndex();$('#pop').style.display='none'}});
function openGlossary(){const ks=Object.keys(GL);openModal(`<div class="mhead"><h2>GLOSARIO</h2></div><div class="mbody"><input class="search" id="gq" placeholder="Buscar término…"><div class="gl" id="glist"></div></div>`);const d=q=>{q=q.toLowerCase();$('#glist').innerHTML=ks.filter(k=>(GL[k].t+GL[k].d).toLowerCase().includes(q)).map(k=>`<div><b>${GL[k].t}</b><div>${GL[k].d}</div>${GL[k].f?`<div class="f" style="font-size:.76rem">${GL[k].f}</div>`:''}<div style="font-size:.72rem;color:#888">${GL[k].s}</div></div>`).join('')};d('');$('#gq').oninput=e=>d(e.target.value)}
function openAcr(){const ks=Object.keys(ACR).sort((a,b)=>a.localeCompare(b,'es'));openModal(`<div class="mhead"><h2>SIGLAS</h2></div><div class="mbody"><input class="search" id="aq" placeholder="Buscar sigla o término…"><div id="alist"></div></div>`);const d=q=>{q=q.toLowerCase();$('#alist').innerHTML=`<table class="tb"><tr><th>Sigla</th><th>Significado</th><th>Término original</th></tr>${ks.filter(k=>(k+ACR[k][0]+ACR[k][1]).toLowerCase().includes(q)).map(k=>`<tr><td><b style="color:#E50914">${k}</b></td><td>${ACR[k][0]}</td><td style="color:#888">${ACR[k][1]}</td></tr>`).join('')}</table>`};d('');$('#aq').oninput=e=>d(e.target.value)}
function openRefs(){openModal(`<div class="mhead"><h2>REFERENCIAS</h2></div><div class="mbody"><ol style="font-size:.88rem">${REFS.map(r=>'<li style="margin:.4rem 0">'+r+'</li>').join('')}</ol><p style="font-size:.85rem;color:#6d6d6d">AURORA Pay es un proyecto ficticio con fines formativos; sus cifras son ilustrativas.</p></div>`)}
function openCtx(){openModal(`<div class="mhead"><h2>UBICACIÓN EN LA GUÍA PMBOK® 8</h2></div><div class="mbody">${CTX_HTML.replace(/lecciones? /g,'temas ').replace(/class="tb"/g,'class="tb"')}</div>`)}
function openIndex(){$('#index').classList.add('on')}
function closeIndex(){$('#index').classList.remove('on')}

build();
